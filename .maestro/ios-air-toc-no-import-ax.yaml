# Known failing native regression: visible TOC absent from AX on Air build36.
# Canonical wrapper, Air984D0C64-C0B2-4204-92A9-2C65519089E8 LOCAL8082 only.
# Prerequisites: cold Library, existing own27; no reset/import/provider calls.
# Retain screenshot AND hierarchy; visual presence alone is not acceptance.
appId: com.mishanaer.readany.dev
---
- extendedWaitUntil:
    visible: "Library"
    timeout: 30000
- tapOn: "My books"
- tapOn: "Аудит 27 - Граница глав"
- extendedWaitUntil:
    visible: "Narra Reader"
    timeout: 10000
- runFlow:
    when:
      notVisible: "Book actions"
    commands:
      - tapOn:
          point: "50%,50%"
- tapOn: "Book actions"
- tapOn: "Table of Contents"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: toc-no-import-before-ax
- assertVisible: "Table of Contents"
- assertVisible: "Свет в мастерской"
- assertVisible: "Последняя переправа"
- tapOn: "Close"
- assertVisible: "Narra Reader"
