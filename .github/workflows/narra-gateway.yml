name: Narra Gateway

on:
  pull_request:
    paths:
      - "services/narra-gateway/**"
      - "stats/narra/**"
      - "scripts/qa/book-analysis-pipeline-canary*"
      - "scripts/qa/multichunk-book-fixture*"
      - "scripts/qa/multichunk-live-acceptance*"
      - "scripts/qa/staged-campaign-acceptance*"
      - "scripts/qa/recorded-multichunk*"
      - "docs/reviews/evidence/subscription-multichunk-live-2026-09-05.json"
      - "scripts/qa/gateway-mixed-load-smoke*"
      - ".github/workflows/narra-gateway.yml"
  push:
    branches: [main]
    paths:
      - "services/narra-gateway/**"
      - "stats/narra/**"
      - "scripts/qa/book-analysis-pipeline-canary*"
      - "scripts/qa/multichunk-book-fixture*"
      - "scripts/qa/multichunk-live-acceptance*"
      - "scripts/qa/staged-campaign-acceptance*"
      - "scripts/qa/recorded-multichunk*"
      - "docs/reviews/evidence/subscription-multichunk-live-2026-09-05.json"
      - "scripts/qa/gateway-mixed-load-smoke*"
      - ".github/workflows/narra-gateway.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: narra_ci
          POSTGRES_PASSWORD: narra_ci_test_only
          POSTGRES_DB: narra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U narra_ci -d narra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/narra-gateway/package-lock.json

      - name: Install dependencies
        working-directory: services/narra-gateway
        run: npm ci

      - name: Migrate isolated test database
        working-directory: services/narra-gateway
        env:
          DATABASE_URL: postgresql://narra_ci:narra_ci_test_only@127.0.0.1:5432/narra_test
          DATABASE_SSL_MODE: disable
        # Some integration suites expect the schema to exist before they start.
        run: npm run migrate

      - name: Start isolated S3-compatible test storage
        # Same digest/config as compose.book-analysis-local.yml. Test credentials
        # and loopback binding only; no cloud account or paid provider is used.
        run: |
          docker run --detach --rm --name narra-ci-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=narra-root \
            --env MINIO_ROOT_PASSWORD=narra-local-minio-secret \
            minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data --address :9000 --console-address :9001
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            echo "Waiting for local MinIO (${attempt}/30)"
            sleep 1
          done
          docker logs narra-ci-minio
          exit 1

      - name: Test gateway including PostgreSQL and real S3
        working-directory: services/narra-gateway
        env:
          BOOK_MARKUP_TEST_DATABASE_URL: postgresql://narra_ci:narra_ci_test_only@127.0.0.1:5432/narra_test
          GENERATION_COST_E2E_DATABASE_URL: postgresql://narra_ci:narra_ci_test_only@127.0.0.1:5432/narra_test
          BOOK_MARKUP_E2E_DATABASE_URL: postgresql://narra_ci:narra_ci_test_only@127.0.0.1:5432/narra_test
          BOOK_MARKUP_E2E_S3_ENDPOINT: http://127.0.0.1:9000
          BOOK_MARKUP_E2E_S3_ACCESS_KEY: narra-root
          BOOK_MARKUP_E2E_S3_SECRET_KEY: narra-local-minio-secret
        # Serial files keep durable worker claims isolated between test suites.
        run: node --test --test-concurrency=1

      - name: Stop isolated S3 test storage
        if: always()
        run: |
          docker logs narra-ci-minio || true
          docker rm --force narra-ci-minio || true

      - name: Create fresh own-book pipeline databases
        working-directory: services/narra-gateway
        env:
          QA_PROVISION_DB_URL: postgresql://narra_ci:narra_ci_test_only@127.0.0.1:5432/postgres
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.QA_PROVISION_DB_URL });
          await client.connect();
          try {
            await client.query('CREATE DATABASE narra_qa_pipeline_ci_window');
            await client.query('CREATE DATABASE narra_qa_pipeline_ci_siblings');
            await client.query('CREATE DATABASE narra_qa_pipeline_ci_recorded');
          } finally { await client.end(); }
          JS

      - name: Test multi-chunk publication and isolated mixed HTTP traffic
        env:
          QA_DB_URL: postgresql://narra_ci:narra_ci_test_only@127.0.0.1:5432/narra_qa_pipeline_ci_window
          QA_DB_CONFIRM: narra_qa_pipeline_ci_window
          QA_MULTI_DB_URL: postgresql://narra_ci:narra_ci_test_only@127.0.0.1:5432/narra_qa_pipeline_ci_siblings
          QA_MULTI_DB_CONFIRM: narra_qa_pipeline_ci_siblings
          QA_REPLAY_DB_URL: postgresql://narra_ci:narra_ci_test_only@127.0.0.1:5432/narra_qa_pipeline_ci_recorded
          QA_REPLAY_DB_CONFIRM: narra_qa_pipeline_ci_recorded
        # Explicit mock-only fixtures; no Codex CLI, subscription or paid provider.
        run: >-
          node --test --test-concurrency=1
          scripts/qa/book-analysis-pipeline-canary.test.mjs
          scripts/qa/multichunk-book-fixture.test.mjs
          scripts/qa/multichunk-live-acceptance.test.mjs
          scripts/qa/staged-campaign-acceptance.test.mjs
          scripts/qa/recorded-multichunk-model.test.mjs
          scripts/qa/recorded-multichunk-pipeline.test.mjs
          scripts/qa/gateway-mixed-load-smoke.test.mjs

      - name: Test Stats contract
        working-directory: stats/narra
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest test_server.py

      - name: Validate operations scripts
        run: bash -n services/narra-gateway/*.sh

      - name: Validate production Compose
        env:
          CATALOG_INGEST_TOKEN: ci-compose-validation
          GENERATOR_SERVICE_TOKEN: ci-compose-validation
          NARRA_MINIO_ROOT_PASSWORD: ci-compose-validation
          NARRA_POSTGRES_PASSWORD: ci-compose-validation
          NARRA_STORAGE_SECRET_ACCESS_KEY: ci-compose-validation
        run: |
          sudo install -m 0644 /dev/null /etc/narra-gateway.env
          NARRA_GATEWAY_IMAGE=readany/narra-gateway:ci \
            docker compose -f services/narra-gateway/compose.i167.yml \
              --profile operations config >/dev/null

      - name: Build production image
        working-directory: services/narra-gateway
        run: docker build --build-arg GATEWAY_BUILD_VERSION=ci -t readany/narra-gateway:ci .

  publish-test-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/narra-gateway"
          echo "NARRA_PUBLISHED_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish TEST image
        working-directory: services/narra-gateway
        run: |
          docker build --pull \
            --build-arg "GATEWAY_BUILD_VERSION=$GITHUB_SHA" \
            --tag "$NARRA_PUBLISHED_IMAGE:$GITHUB_SHA" \
            --tag "$NARRA_PUBLISHED_IMAGE:test-latest" \
            .
          docker push "$NARRA_PUBLISHED_IMAGE:$GITHUB_SHA"
          docker push "$NARRA_PUBLISHED_IMAGE:test-latest"
