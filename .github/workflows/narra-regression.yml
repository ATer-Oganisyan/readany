name: Narra Regression

on:
  pull_request:
    paths:
      - "packages/app-expo/**"
      - "packages/core/**"
      - "packages/foliate-js/**"
      - "packages/deslop-primitives/**"
      - "services/narra-gateway/**"
      - "scripts/qa/capture-character-*.mjs"
      - "patches/**"
      - "scripts/qa/expo-factory-race-harness.mm"
      - "scripts/qa/test-expo-factory-race.mjs"
      - "scripts/qa/expo-fabric-context-harness.swift"
      - "scripts/qa/test-expo-fabric-context.mjs"
      - "scripts/qa/ios-scene-startup-harness.swift"
      - "scripts/qa/test-ios-scene-startup.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/narra-regression.yml"
  push:
    branches: [main]
    paths:
      - "packages/app-expo/**"
      - "packages/core/**"
      - "packages/foliate-js/**"
      - "packages/deslop-primitives/**"
      - "services/narra-gateway/**"
      - "scripts/qa/capture-character-*.mjs"
      - "patches/**"
      - "scripts/qa/expo-factory-race-harness.mm"
      - "scripts/qa/test-expo-factory-race.mjs"
      - "scripts/qa/expo-fabric-context-harness.swift"
      - "scripts/qa/test-expo-fabric-context.mjs"
      - "scripts/qa/ios-scene-startup-harness.swift"
      - "scripts/qa/test-ios-scene-startup.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/narra-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narra-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-factory-native:
    # Foundation/ARC + ThreadSanitizer; no simulator, CocoaPods or app build.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install patched dependencies without lifecycle builds
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify native harness prerequisites
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          xcrun --find clang++
          xcrun --sdk macosx --show-sdk-path

      - name: Test actual Expo factory overlap, ownership and publication races
        run: node scripts/qa/test-expo-factory-race.mjs

      - name: Test cached Fabric initializer teardown and live-context errors
        run: node scripts/qa/test-expo-fabric-context.mjs

      - name: Test generated iOS cold-link startup against native launcher admission
        run: node scripts/qa/test-ios-scene-startup.mjs

  mobile-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build reader assets
        run: pnpm --filter @readany/app-expo build:reader

      - name: Test shared core
        run: pnpm --filter @readany/core test

      - name: Test mobile reading, import, scenes and persistence
        run: pnpm --filter @readany/app-expo test

      - name: Test actual mobile character request through gateway serialization (no model)
        run: node --test scripts/qa/capture-character-chat-fixture.test.mjs scripts/qa/capture-character-provider-fixture.test.mjs

      - name: Typecheck mobile app
        run: pnpm --filter @readany/app-expo exec tsc --noEmit
