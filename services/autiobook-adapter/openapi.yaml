openapi: 3.1.0
info:
  title: Narra external autiobook adapter
  version: autiobook-adapter-v1
  description: Internal candidate adapter; Narra independently validates every observation.
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [ok, contractVersion, upstreamRevision]
                properties:
                  ok: { type: boolean, const: true }
                  contractVersion: { type: string, const: autiobook-adapter-v1 }
                  upstreamRevision: { type: string }
  /internal/v1/analyze:
    post:
      operationId: analyzeBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Exact-grounded candidate observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "401": { description: Missing or invalid service token }
        "422": { description: Invalid request }
        "502": { description: Pinned upstream failed }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, idempotencyKey, source]
      properties:
        contractVersion:
          type: string
          const: autiobook-adapter-v1
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 256
        source:
          type: object
          additionalProperties: false
          required: [text, sha256]
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 33554432
            sha256:
              type: string
              pattern: "^[0-9a-f]{64}$"
    AnalyzeResponse:
      type: object
      additionalProperties: false
      required:
        - contractVersion
        - provider
        - extractorVersion
        - sourceSha256
        - observations
        - diagnostics
      properties:
        contractVersion: { type: string, const: autiobook-adapter-v1 }
        provider:
          type: object
          additionalProperties: false
          required: [name, upstreamRevision, model, castChunkWords, castOverlapWords, revise]
          properties:
            name: { type: string, const: autiobook }
            upstreamRevision:
              type: string
              const: d532bdd0a15f2948fd0c99f5e11b92677cb5c3eb
            model: { type: string, minLength: 1 }
            castChunkWords: { type: integer, const: 1500 }
            castOverlapWords: { type: integer, const: 400 }
            revise: { type: boolean, const: false }
        extractorVersion: { type: string, const: autiobook-adapter-v1 }
        sourceSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        observations:
          type: array
          maxItems: 100000
          items:
            $ref: "#/components/schemas/Observation"
        diagnostics:
          type: object
          additionalProperties: false
          required:
            - rawCharacters
            - usedCharacters
            - alignedSegments
            - exactDialogueSegments
            - droppedSegments
            - unmappedSpeakers
            - groundedAliases
          properties:
            rawCharacters: { type: integer, minimum: 0 }
            usedCharacters: { type: integer, minimum: 0 }
            alignedSegments: { type: integer, minimum: 0 }
            exactDialogueSegments: { type: integer, minimum: 0 }
            droppedSegments: { type: integer, minimum: 0 }
            unmappedSpeakers: { type: integer, minimum: 0 }
            groundedAliases: { type: integer, minimum: 0 }
    Observation:
      type: object
      additionalProperties: false
      required:
        - observationKey
        - type
        - entityKind
        - entityCandidate
        - relatedEntityCandidates
        - fact
        - evidence
        - confidence
      properties:
        observationKey:
          type: string
          pattern: "^obs:[0-9a-f]{48}$"
        type:
          type: string
          enum: [character_dialogue, character_alias]
        entityKind: { type: string, const: character }
        entityCandidate: { type: string, minLength: 1, maxLength: 512 }
        relatedEntityCandidates:
          type: array
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 512 }
        fact: { type: string, minLength: 1, maxLength: 4000 }
        evidence:
          type: object
          additionalProperties: false
          required: [quote, startOffset, endOffset, offsetEncoding]
          properties:
            quote: { type: string, minLength: 1, maxLength: 4000 }
            startOffset: { type: integer, minimum: 0 }
            endOffset: { type: integer, minimum: 1 }
            offsetEncoding: { type: string, const: utf-16 }
        confidence: { type: number, minimum: 0, maximum: 1 }
