appId: com.mishanaer.readany.dev
name: iOS reader closes directly to Library after repeated note returns
---
- launchApp:
    stopApp: false
- assertVisible: "Narra Reader"
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            notVisible: "Book actions"
          commands:
            - tapOn:
                point: "50%,50%"
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Library"
    timeout: 15000
- takeScreenshot: ios-library-after-repeated-note-returns
