appId: com.mishanaer.readany.dev
name: Android other book notebook does not leak the first book notes
# Precondition: Library; only the original QA fixtures are selected.
---
- runFlow:
    file: flows/android-open-fixture.yaml
    env:
      BOOK_TITLE: 15-large-original
- extendedWaitUntil:
    notVisible: Book actions
    timeout: 10000
- tapOn:
    point: "50%,50%"
- tapOn: Book actions
- tapOn: Notes
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: No notes yet
- assertNotVisible: .*NARRA_ANDROID_QA_BOOK_SCOPE_20260905.*
- takeScreenshot: android-other-book-empty-notes
