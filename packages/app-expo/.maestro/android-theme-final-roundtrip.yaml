appId: com.mishanaer.readany.dev
name: Android settings labels and note statusbar theme roundtrip
# Final runtime, Library, original selection System and system night mode off.
---
- runFlow:
    file: android-status-theme-profile.yaml
- assertVisible: System
- tapOn: System
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: Dark
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: Dark
- assertNotVisible: System
- takeScreenshot: android-settings-dark-labels-after
- tapOn:
    point: "12%,93%"
- runFlow:
    file: android-status-notes-current-theme.yaml
    env:
      SNAPSHOT: android-status-dark-notes-final-after
- runFlow:
    file: android-status-restore-system.yaml
