appId: com.mishanaer.readany.dev
name: Android saves the exact edited original scoped note
# Precondition: first own note is in inline Edit mode. Replace via physical
# Android Ctrl+A then input text NARRA_ANDROID_QA_BOOK_SCOPE_20260905_EDITED.
# Verify the focused native EditText equals that marker before running this flow.
---
- assertVisible: .*NARRA_ANDROID_QA_BOOK_SCOPE_20260905_SECOND.*
- assertVisible: Cancel
- assertVisible: NARRA_ANDROID_QA_BOOK_SCOPE_20260905_EDITED
- assertNotVisible: .*20260905_1218.*
- takeScreenshot: android-own-book-note-inline-editor
- hideKeyboard
- tapOn: Save
- extendedWaitUntil:
    notVisible: Cancel
    timeout: 10000
- assertVisible: .*NARRA_ANDROID_QA_BOOK_SCOPE_20260905_EDITED.*
- takeScreenshot: android-own-book-note-edited
