appId: com.mishanaer.readany.dev
name: Read original multilingual EPUB, FB2, TXT, FBZ, UMD and Kindle on iOS
# Prerequisite: native picker import of the generated audit fixtures.
# Does not clear user data. Run only against the audit books.
---
- launchApp
- extendedWaitUntil:
    visible: "Library"
    timeout: 30000
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "07-garden-cp1251"
      EVIDENCE_NAME: ios-txt-cp1251
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "Аудит 23 - Письмо MOBI"
      EVIDENCE_NAME: ios-mobi
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "Аудит 24 - Письмо AZW3"
      EVIDENCE_NAME: ios-azw3
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "Аудит 25 - Письмо AZW"
      EVIDENCE_NAME: ios-azw
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "15-large-original"
      EVIDENCE_NAME: ios-large-txt
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "06-library-utf16"
      EVIDENCE_NAME: ios-txt-utf16
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "05-lantern-utf8"
      EVIDENCE_NAME: ios-txt-utf8
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "Аудит 03 - Остров FB2"
      EVIDENCE_NAME: ios-fb2-utf8
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "Аудит 01 - Письмо у реки"
      EVIDENCE_NAME: ios-epub
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "Аудит 02 - Мастерская 100%"
      EVIDENCE_NAME: ios-epub-filename
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "08-archive"
      EVIDENCE_NAME: ios-fbz
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "09-nested.fb2"
      EVIDENCE_NAME: ios-fb2-zip
- runFlow:
    file: flows/ios-read-fixture.yaml
    env:
      BOOK_TITLE: "Аудит 10 - Переправа UMD"
      EVIDENCE_NAME: ios-umd
