appId: com.mishanaer.readany.dev
name: Native URL error details and toast timer recovery
# Prerequisite: real URL prompt contains localhost:8099/17-truncated.epub.
---
- tapOn:
    id: android:id/button1
    waitToSettleTimeoutMs: 0
- tapOn:
    text: Details
    waitToSettleTimeoutMs: 0
- assertVisible: Files not added
- takeScreenshot: android-url-error-details-after
- tapOn: Close
- extendedWaitUntil:
    notVisible: Import failed
    timeout: 15000
- assertVisible: Library
- takeScreenshot: android-url-error-toast-dismissed-after
