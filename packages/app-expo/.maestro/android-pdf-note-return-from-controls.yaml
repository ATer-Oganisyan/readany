appId: com.mishanaer.readany.dev
name: Android PDF note return after a separate physical center tap
# Own PDF page 4; controls physically opened. No navigation action was injected.
---
- extendedWaitUntil:
    visible: Book actions
    timeout: 10000
- tapOn: Book actions
- tapOn: Notes
- extendedWaitUntil:
    visible: .*NARRA_ANDROID_PDF_PAGE3.*
    timeout: 15000
- takeScreenshot: android-pdf-page-anchor-note
- tapOn: .*NARRA_ANDROID_PDF_PAGE3.*
- extendedWaitUntil:
    visible: Narra Reader
    timeout: 15000
- extendedWaitUntil:
    notVisible: Book actions
    timeout: 10000
- assertVisible: p. 3 of 12
- takeScreenshot: android-pdf-note-restored-page-three
