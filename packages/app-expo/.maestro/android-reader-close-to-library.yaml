appId: com.mishanaer.readany.dev
name: Android reader Close returns directly to Library
---
- assertVisible: Narra Reader
- runFlow:
    when:
      notVisible: Book actions
    commands:
      - tapOn:
          point: "50%,50%"
- tapOn: Close
- extendedWaitUntil:
    visible: Library
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: android-reader-close-library-after
