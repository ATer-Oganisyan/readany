appId: com.mishanaer.readany.dev
name: Android dark theme statusbar control in a book notebook
# Precondition: Profile scrolled to Theme, original selection System.
---
- tapOn: System
- tapOn: Dark
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: android-status-dark-profile
- tapOn:
    point: "12%,93%"
- runFlow:
    file: flows/android-open-fixture.yaml
    env:
      BOOK_TITLE: 26-mixed-recovery
- extendedWaitUntil:
    notVisible: Book actions
    timeout: 10000
- tapOn:
    point: "50%,50%"
- takeScreenshot: android-status-dark-app-reader
- tapOn: Book actions
- tapOn: Notes
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: .*NARRA_ANDROID_QA_BOOK_SCOPE_20260905_EDITED.*
- takeScreenshot: android-status-dark-notes
