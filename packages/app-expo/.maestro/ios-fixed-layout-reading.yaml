appId: com.mishanaer.readany.dev
name: iOS CBZ and PDF physical pages and exact resume
---
- runFlow:
    file: flows/ios-open-fixture.yaml
    env:
      BOOK_TITLE: "12-river-comic"
      PAGE_LABEL: "p. 1 of 4"
- takeScreenshot: ios-cbz-first-page
- repeat:
    times: 3
    commands:
      - tapOn:
          point: "95%,40%"
- extendedWaitUntil:
    visible: "p. 4 of 4"
    timeout: 15000
- takeScreenshot: ios-cbz-last-page
- tapOn:
    point: "5%,40%"
- extendedWaitUntil:
    visible: "p. 3 of 4"
    timeout: 10000
- tapOn:
    point: "50%,50%"
- tapOn: "Close"
- runFlow:
    file: flows/ios-open-fixture.yaml
    env:
      BOOK_TITLE: "12-river-comic"
      PAGE_LABEL: "p. 3 of 4"
- takeScreenshot: ios-cbz-restored-page
- extendedWaitUntil:
    notVisible: "Listen"
    timeout: 10000
- tapOn:
    point: "50%,50%"
- tapOn: "Close"
- runFlow:
    file: flows/ios-open-fixture.yaml
    env:
      BOOK_TITLE: "11-river-library"
      PAGE_LABEL: "p. 1 of 12"
- takeScreenshot: ios-pdf-first-page
- repeat:
    times: 4
    commands:
      - tapOn:
          point: "95%,40%"
- extendedWaitUntil:
    visible: "p. 5 of 12"
    timeout: 15000
- tapOn:
    point: "5%,40%"
- extendedWaitUntil:
    visible: "p. 4 of 12"
    timeout: 10000
- takeScreenshot: ios-pdf-fourth-page
- tapOn:
    point: "50%,50%"
- tapOn: "Close"
- runFlow:
    file: flows/ios-open-fixture.yaml
    env:
      BOOK_TITLE: "11-river-library"
      PAGE_LABEL: "p. 4 of 12"
- takeScreenshot: ios-pdf-restored-page
- extendedWaitUntil:
    notVisible: "Listen"
    timeout: 10000
- tapOn:
    point: "50%,50%"
- tapOn: "Close"
- assertVisible: "Library"
