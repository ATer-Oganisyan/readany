appId: com.mishanaer.readany.dev
name: Android explicit Light verifies note statusbar independently of System feedback
# Library; theme setting System currently resolves dark due to recorded BEFORE bug.
---
- runFlow:
    file: android-status-theme-profile.yaml
- tapOn: System
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: Light
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: Light
- assertNotVisible: System
- takeScreenshot: android-settings-explicit-light
- tapOn:
    point: "12%,93%"
- runFlow:
    file: android-status-notes-current-theme.yaml
    env:
      SNAPSHOT: android-status-explicit-light-notes-after
- back
- extendedWaitUntil:
    visible: Narra Reader
    timeout: 10000
- back
- assertVisible: Library
