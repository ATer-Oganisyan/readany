appId: com.mishanaer.readany.dev
name: iOS PDF native word selection after text-layer scale fix
# Original QA PDF. Target resolves to the first visible diary line on page 4.
---
- launchApp:
    stopApp: false
- runFlow:
    file: flows/ios-open-fixture.yaml
    env:
      BOOK_TITLE: "11-river-library"
      PAGE_LABEL: "p. 4 of 12"
- extendedWaitUntil:
    notVisible: "Listen"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-pdf-final-scale-before-selection
- longPressOn:
    point: "29%,31%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-pdf-word-selection-after
