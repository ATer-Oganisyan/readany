appId: com.mishanaer.readany.dev
name: Android native EPUB selection control for the PDF menu investigation
# Prerequisite: own PDF with an active word selection.
---
- tapOn:
    point: "50%,70%"
- back
- extendedWaitUntil:
    visible: Library
    timeout: 15000
- runFlow:
    file: flows/android-open-fixture.yaml
    env:
      BOOK_TITLE: 26-mixed-recovery
- extendedWaitUntil:
    notVisible: Book actions
    timeout: 10000
- longPressOn:
    point: "200,625"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: android-epub-selection-menu-control
