appId: com.mishanaer.readany.dev
name: Android own empty book notebook opens with the selected book
---
- runFlow:
    file: flows/android-open-fixture.yaml
    env:
      BOOK_TITLE: 26-mixed-recovery
- assertVisible: .*Анна.*
- extendedWaitUntil:
    notVisible: Book actions
    timeout: 10000
- tapOn:
    point: "50%,50%"
- tapOn: Book actions
- tapOn: Notes
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: No notes yet
- takeScreenshot: android-own-book-empty-notes
- tapOn:
    text: Add note
    below: No notes yet
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 26-mixed-recovery
- takeScreenshot: android-own-book-note-editor
