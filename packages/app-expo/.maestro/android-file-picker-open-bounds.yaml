appId: com.mishanaer.readany.dev
name: Android file picker Open native bounds regression
env:
  IMPORT_FILE: 09-nested.fb2.zip
---
# Preconditions: LOCAL emulator-5556, development gateway/Metro verified,
# native Files picker open at the reviewed fixture directory. IMPORT_FILE must
# be fresh: an identical repeat import intentionally has no Open action.
# Run with --udid emulator-5556 --no-reinstall-driver. Never clear/reset app data.
- assertVisible: "${IMPORT_FILE}"
- tapOn: "${IMPORT_FILE}"
- extendedWaitUntil:
    visible: "Open"
    timeout: 7000
- takeScreenshot: file-open-visible
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Book actions"
    timeout: 10000
- assertNotVisible: "My books"
- takeScreenshot: file-open-reader
# Inspect the actual book text in the screenshot; navigation chrome alone is
# insufficient. Then verify dismissal, Back, reopen, and preserved book state.
