appId: com.mishanaer.readany.dev
name: iOS independently imported new edition opens and remains readable
---
- launchApp
- extendedWaitUntil:
    visible: "Library"
    timeout: 30000
- runFlow:
    file: flows/ios-open-fixture.yaml
    env:
      BOOK_TITLE: "Аудит 14 - Новая редакция реки"
      PAGE_LABEL: "p. 1 of .*"
- takeScreenshot: ios-new-edition-first-page
- repeat:
    times: 10
    commands:
      - tapOn:
          point: "95%,40%"
      - waitForAnimationToEnd:
          timeout: 3000
- takeScreenshot: ios-new-edition-after-ten-turns
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            notVisible: "Book actions"
          commands:
            - tapOn:
                point: "50%,50%"
- tapOn: "Close"
- assertVisible: "Library"
