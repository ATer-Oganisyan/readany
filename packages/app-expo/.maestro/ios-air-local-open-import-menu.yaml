appId: com.mishanaer.readany.dev
name: Disable Expo overlay and open actual import menu
---
- tapOn:
    point: "85%,64%"
- takeScreenshot: ios-air-tools-button-off
- tapOn:
    point: "92%,12%"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ios-air-library-no-overlay
- tapOn: "Add book"
- takeScreenshot: ios-air-import-menu
