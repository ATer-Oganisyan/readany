appId: com.mishanaer.readany.dev
name: iOS chapter navigation and notes roundtrip
# Own three-chapter FBZ must be open. No note or bookmark writes.
---
- launchApp:
    stopApp: false
- assertVisible: "Narra Reader"
- runFlow:
    when:
      notVisible: "Book actions"
    commands:
      - tapOn:
          point: "50%,50%"
- tapOn: "Book actions"
- tapOn: "Table of Contents"
- extendedWaitUntil:
    visible: "Последняя переправа"
    timeout: 10000
- takeScreenshot: ios-toc-three-chapters
- tapOn: "Последняя переправа"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Narra Reader"
- takeScreenshot: ios-toc-last-chapter-open
- runFlow:
    when:
      notVisible: "Book actions"
    commands:
      - tapOn:
          point: "50%,50%"
- tapOn: "Book actions"
- tapOn: "Notes"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-book-notes-screen
