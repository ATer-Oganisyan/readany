appId: com.mishanaer.readany.dev
name: Reimport mixed audit files without duplicate books or hidden errors
# Prerequisite: Narra Audit folder seeded in the real iOS Files picker.
# The folder contains 25 files and two directories; all valid books already exist.
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Library"
    timeout: 30000
- assertVisible: "Library"
- tapOn: "Add book"
- tapOn: "Choose file"
- extendedWaitUntil:
    visible: ".*Narra Audit.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible: ".*01-river.*"
    commands:
      - tapOn:
          point: "18%,28%"
      - extendedWaitUntil:
          visible: ".*01-river.*"
          timeout: 15000
- tapOn:
    point: "18%,28%"
- extendedWaitUntil:
    visible: "Выбрать все|Select All"
    timeout: 10000
- tapOn: "Выбрать все|Select All"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: all-fixture-files-selected
- tapOn:
    text: "Open|Открыть"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Details"
    timeout: 60000
- takeScreenshot: mixed-import-summary-after
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Details"
    waitToSettleTimeoutMs: 0
- runFlow:
    when:
      notVisible: "Files that could not be added"
    commands:
      - tapOn:
          point: "26%,17%"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Files that could not be added"
- takeScreenshot: mixed-import-details-after
- tapOn: "Close"
- assertVisible: "Library"
