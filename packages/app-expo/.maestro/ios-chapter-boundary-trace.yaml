appId: com.mishanaer.readany.dev
name: iOS bounded chapter transition with per-step evidence
---
- launchApp:
    stopApp: false
- assertVisible: "Narra Reader"
- runFlow:
    when:
      notVisible: "Book actions"
    commands:
      - tapOn:
          point: "50%,50%"
- tapOn: "Book actions"
- tapOn: "Table of Contents"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "42%,62%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-boundary-start-chapter-one
- repeat:
    times: 8
    commands:
      - tapOn:
          point: "95%,40%"
- takeScreenshot: ios-boundary-after-eight
- tapOn:
    point: "95%,40%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-boundary-after-nine
- tapOn:
    point: "95%,40%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-boundary-after-ten
- tapOn:
    point: "95%,40%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-boundary-after-eleven
