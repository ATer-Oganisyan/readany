appId: com.mishanaer.readany.dev
name: iOS own missing CBZ restored through Files without losing its page
# Continues the real picker opened by ios-cbz-missing-open.yaml.
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: ".*Narra Audit.*"
    timeout: 15000
- runFlow:
    when:
      notVisible: ".*01-river.*"
    commands:
      - tapOn:
          point: "18%,28%"
      - extendedWaitUntil:
          visible: ".*01-river.*"
          timeout: 10000
- scrollUntilVisible:
    element:
      text: ".*12-river-comic.*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: ios-cbz-repair-select-original
- tapOn: ".*12-river-comic.*"
- runFlow:
    when:
      visible: "Open|Открыть"
    commands:
      - tapOn: "Open|Открыть"
- extendedWaitUntil:
    visible: "Narra Reader"
    timeout: 30000
- assertVisible: "p. 3 of 4"
- takeScreenshot: ios-cbz-repaired-same-page
