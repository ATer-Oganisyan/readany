appId: com.mishanaer.readany.dev
name: Isolated Air cold-start reader and bookmark controls
# Requires the QA-owned fixture27 and its page-1 bookmark. Launch through the
# canonical wrapper on the exact Air device / LOCAL8082 first. Verify screenshot
# and exact CFI with the read-only inspector; this flow alone is not acceptance.
---
- runFlow: ios-air-local-cold-open.yaml
- runFlow:
    when:
      notVisible: "Book actions"
    commands:
      - tapOn:
          point: "50%,50%"
          waitToSettleTimeoutMs: 0
- tapOn:
    text: "Book actions"
    waitToSettleTimeoutMs: 0
- tapOn: "Bookmarks"
- takeScreenshot: scene-bookmark-sheet
- tapOn:
    point: "45%,62%"
    waitToSettleTimeoutMs: 0
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: scene-bookmark-return
