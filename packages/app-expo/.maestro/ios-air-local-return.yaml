appId: com.mishanaer.readany.dev
name: Return through Library and reopen own book
---
- tapOn:
    point: "50%,50%"
    waitToSettleTimeoutMs: 0
- tapOn:
    point: "10%,10%"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: "Library"
    timeout: 15000
- takeScreenshot: ios-air-return-library
- tapOn: "Аудит 27 - Граница глав"
- extendedWaitUntil:
    visible: "Narra Reader"
    timeout: 15000
- takeScreenshot: ios-air-return-reader
