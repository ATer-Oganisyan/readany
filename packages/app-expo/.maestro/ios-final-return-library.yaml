appId: com.mishanaer.readany.dev
name: iOS final handoff to Library
---
- launchApp:
    stopApp: false
- assertVisible: "Narra Reader"
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible: "Book actions"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Notes"
    timeout: 10000
- tapOn:
    point: "18%,94%"
- extendedWaitUntil:
    visible: "Library"
    timeout: 15000
- takeScreenshot: ios-library-handoff-final
