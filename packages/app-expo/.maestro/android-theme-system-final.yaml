appId: com.mishanaer.readany.dev
name: Android final Dark to System follows the real light OS immediately
# Final bridge runtime, Library, current app mode Light, OS night mode no.
---
- runFlow:
    file: android-status-theme-profile.yaml
- assertVisible: Light
- tapOn: Light
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: Dark
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: Dark
- assertNotVisible: Light
- takeScreenshot: android-system-final-dark-control
- tapOn: Dark
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: System
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: System
- assertNotVisible: Dark
- takeScreenshot: android-system-final-restored-profile
- tapOn:
    point: "12%,93%"
- runFlow:
    file: android-status-notes-current-theme.yaml
    env:
      SNAPSHOT: android-system-final-light-notes
- back
- extendedWaitUntil:
    visible: Narra Reader
    timeout: 10000
- back
- assertVisible: Library
- takeScreenshot: android-system-final-library
