appId: com.mishanaer.readany.dev
name: iOS cached profile to chat to characters to same reading page
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "41%,80%"
- extendedWaitUntil:
    visible: "Message Мармеладов.*"
    timeout: 10000
- takeScreenshot: ios-profile-return-to-chat
- tapOn:
    point: "7%,11%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-chat-return-to-characters
- swipe:
    start: "50%,50%"
    end: "50%,94%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-cached-character-return-reader
- assertVisible: "Narra Reader"
