appId: com.mishanaer.readany.dev
name: Open an imported original fixture and turn ten pages
---
- assertVisible: "Library"
- repeat:
    times: 4
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 85%
          duration: 150
- tapOn: "My books"
- scrollUntilVisible:
    element:
      text: ${BOOK_TITLE}
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: ${BOOK_TITLE}
- extendedWaitUntil:
    visible: ".*Анна.*"
    timeout: 30000
- takeScreenshot: ${EVIDENCE_NAME}-opened
- repeat:
    times: 10
    commands:
      - tapOn:
          point: 95%, 40%
- assertVisible: "Narra Reader"
- takeScreenshot: ${EVIDENCE_NAME}-after-ten-pages
- back
- assertVisible: "Library"
