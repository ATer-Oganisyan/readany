appId: com.mishanaer.readany.dev
name: Open an imported book, read ten pages and return on iOS
---
- assertVisible: "Library"
- repeat:
    times: 4
    commands:
      - swipe:
          start: "50%,30%"
          end: "50%,85%"
          duration: 200
- tapOn: "My books"
- scrollUntilVisible:
    element:
      text: ${BOOK_TITLE}
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: ${BOOK_TITLE}
- extendedWaitUntil:
    notVisible: "Library"
    timeout: 15000
- extendedWaitUntil:
    visible: "Narra Reader"
    timeout: 30000
- repeat:
    times: 5
    while:
      notVisible: ".*Анна.*"
    commands:
      - tapOn:
          point: "95%,40%"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible: ".*Анна.*"
    timeout: 30000
- takeScreenshot: ${EVIDENCE_NAME}-opened
- repeat:
    times: 10
    commands:
      - tapOn:
          point: "95%,40%"
- assertVisible: "Narra Reader"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: ".*Анна.*"
    timeout: 15000
- takeScreenshot: ${EVIDENCE_NAME}-after-ten-pages
- extendedWaitUntil:
    notVisible: "Listen"
    timeout: 10000
- tapOn:
    point: "50%,50%"
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Library"
    timeout: 15000
