appId: com.mishanaer.readany.dev
---
- assertVisible: "Library"
- tapOn: "Add book"
- tapOn: "Add from link"
- assertVisible: "Book link"
- tapOn: "Book file or Ficbook story link"
- inputText: ${BOOK_URL}
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Add"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: ${RESULT_TEXT}
    timeout: 20000
- takeScreenshot: ${EVIDENCE_NAME}
- extendedWaitUntil:
    notVisible: ${RESULT_TEXT}
    timeout: 20000
- assertVisible: "Library"
