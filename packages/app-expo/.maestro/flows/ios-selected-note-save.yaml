appId: com.mishanaer.readany.dev
---
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 10000
- tapOn: "Start writing…"
- inputText: "NARRA QA durable PDF note."
- tapOn: "Save note"
- extendedWaitUntil:
    visible: "Narra Reader"
    timeout: 10000
- runFlow:
    when:
      notVisible: "Book actions"
    commands:
      - tapOn:
          point: "50%,50%"
- tapOn: "Book actions"
- tapOn: "Notes"
- extendedWaitUntil:
    visible: ".*NARRA QA durable PDF note.*"
    timeout: 10000
- assertNotVisible: ".*NARRA QA scoped first: FBZ chapter three.*"
- takeScreenshot: ios-pdf-note-saved-final
- tapOn: "Edit note"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-pdf-note-inline-editor-final
