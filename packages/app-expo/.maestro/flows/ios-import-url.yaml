appId: com.mishanaer.readany.dev
---
- assertVisible: "Library"
- tapOn: "Add book"
- tapOn: "Add from link"
- assertVisible: "Book link"
- tapOn: "Book file or Ficbook story link"
- inputText: ${BOOK_URL}
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Add"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    notVisible: "Cancel"
    timeout: 60000
- takeScreenshot: ${EVIDENCE_NAME}-summary
- repeat:
    times: 4
    commands:
      - swipe:
          start: "50%,30%"
          end: "50%,85%"
          duration: 200
- tapOn: "My books"
- scrollUntilVisible:
    element:
      text: ${BOOK_TITLE}
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE_NAME}-metadata
