appId: com.mishanaer.readany.dev
name: Android returns from a saved PDF note to its exact source page
# Our own PDF is already on page 4, selection dismissed; exactly one new QA note.
---
- runFlow:
    when:
      visible: Book actions
    commands:
      - tapOn:
          point: "50%,50%"
- assertVisible: p. 4 of 12
- takeScreenshot: android-pdf-note-away-page-four
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible: Book actions
    timeout: 10000
- tapOn: Book actions
- tapOn: Notes
- extendedWaitUntil:
    visible: .*NARRA_ANDROID_PDF_PAGE3.*
    timeout: 15000
- takeScreenshot: android-pdf-page-anchor-note
- tapOn: .*NARRA_ANDROID_PDF_PAGE3.*
- extendedWaitUntil:
    visible: Narra Reader
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    notVisible: Book actions
    timeout: 10000
- assertVisible: p. 3 of 12
- takeScreenshot: android-pdf-note-restored-page-three
