appId: com.mishanaer.readany.dev
name: Android selects a real word on the original PDF page
# Library prerequisite; own PDF is saved on page 3. New page-anchor reader asset required.
---
- runFlow:
    file: flows/android-open-fixture.yaml
    env:
      BOOK_TITLE: 11-river-library
- extendedWaitUntil:
    notVisible: Book actions
    timeout: 10000
- takeScreenshot: android-pdf-anchor-original-page
- longPressOn:
    point: "305,644"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: android-pdf-anchor-selected-word
