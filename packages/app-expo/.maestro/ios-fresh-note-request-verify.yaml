appId: com.mishanaer.readany.dev
name: iOS verifies a fresh explicit PDF note request on the native renderer
# Setup was an explicit QA openMobileBook action, not a physical global-note tap.
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Narra Reader"
    timeout: 15000
- extendedWaitUntil:
    visible: "p. 4 of 12"
    timeout: 15000
- takeScreenshot: ios-fresh-note-request-page-four-after
- tapOn:
    point: "95%,40%"
- extendedWaitUntil:
    visible: "p. 5 of 12"
    timeout: 15000
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible: "Book actions"
    timeout: 10000
- tapOn: "Book actions"
- tapOn: "Notes"
- extendedWaitUntil:
    visible: ".*NARRA QA PDF page anchor final 20260905.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: ".*NARRA QA PDF page anchor final 20260905.*"
- extendedWaitUntil:
    visible: "p. 4 of 12"
    timeout: 15000
- takeScreenshot: ios-final-reader-note-return-page-four
