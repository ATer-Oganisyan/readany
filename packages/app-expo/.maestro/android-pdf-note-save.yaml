appId: com.mishanaer.readany.dev
name: Android saves a selected PDF page note
# Native Add note action has opened ManualNote for our PDF; no existing draft.
---
- assertVisible: 11-river-library
- tapOn: Start writing…
- inputText: NARRA_ANDROID_PDF_PAGE3
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: .*NARRA_ANDROID_PDF_PAGE3.*
- takeScreenshot: android-pdf-note-editor-keyboard
- tapOn: Save note
- extendedWaitUntil:
    visible: Narra Reader
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: android-pdf-note-saved-reader
