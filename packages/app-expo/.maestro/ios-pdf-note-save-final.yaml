appId: com.mishanaer.readany.dev
name: iOS final cold PDF selection to saved book note
# Own PDF and new original QA note only. Final acknowledged-save runtime.
---
- launchApp
- extendedWaitUntil:
    visible: "Library"
    timeout: 30000
- runFlow:
    file: flows/ios-open-fixture.yaml
    env:
      BOOK_TITLE: "11-river-library"
      PAGE_LABEL: "p. 4 of 12"
- extendedWaitUntil:
    notVisible: "Listen"
    timeout: 10000
- longPressOn:
    point: "29%,31%"
- waitForAnimationToEnd:
    timeout: 5000
# Native text-selection menu is visible but absent in Maestro AX hierarchy.
- tapOn:
    point: "20%,35%"
- runFlow: flows/ios-selected-note-save.yaml
