appId: com.mishanaer.readany.dev
name: One bounded native small-book open and close cycle
# Prerequisite: Library is already scrolled to the own 26-mixed-recovery card.
---
- assertVisible: Library
- tapOn: 26-mixed-recovery
- extendedWaitUntil:
    visible: Narra Reader
    timeout: 30000
- assertVisible: .*Анна.*
- waitForAnimationToEnd:
    timeout: 5000
- back
- assertVisible: Library
