appId: com.mishanaer.readany.dev
name: Android restores original System theme and verifies light notebook icons
# Precondition: dark book notebook, after the cold-reloaded statusbar fix.
---
- back
- extendedWaitUntil:
    visible: Narra Reader
    timeout: 10000
- back
- assertVisible: Library
- tapOn:
    point: "62%,93%"
- scrollUntilVisible:
    element:
      text: Theme
    direction: DOWN
    timeout: 15000
- tapOn: Dark
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: System
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: System
- assertNotVisible: Dark
- takeScreenshot: android-status-original-system-restored
- tapOn:
    point: "12%,93%"
- runFlow:
    file: android-status-notes-current-theme.yaml
    env:
      SNAPSHOT: android-status-light-notes-after
- back
- extendedWaitUntil:
    visible: Narra Reader
    timeout: 10000
- back
- assertVisible: Library
