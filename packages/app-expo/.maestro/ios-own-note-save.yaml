appId: com.mishanaer.readany.dev
name: iOS save a QA note attached to own imported book
---
- launchApp:
    stopApp: false
- tapOn: "Start writing…"
- inputText: "NARRA QA: chapter-three checkpoint."
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-own-note-keyboard
- tapOn: "Save note"
- extendedWaitUntil:
    visible: ".*NARRA QA: chapter-three checkpoint.*"
    timeout: 10000
- takeScreenshot: ios-own-note-saved
