appId: com.mishanaer.readany.dev
name: iOS saved PDF annotation notebook and edit
---
- launchApp:
    stopApp: false
- assertVisible: "Narra Reader"
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            notVisible: "Book actions"
          commands:
            - tapOn:
                point: "50%,50%"
- tapOn: "Book actions"
- tapOn: "Notes"
- extendedWaitUntil:
    visible: ".*NARRA QA durable PDF note.*"
    timeout: 10000
- assertNotVisible: ".*NARRA QA scoped first: FBZ chapter three.*"
- takeScreenshot: ios-pdf-note-saved-final
- tapOn: "Edit note"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-pdf-note-inline-editor-final
