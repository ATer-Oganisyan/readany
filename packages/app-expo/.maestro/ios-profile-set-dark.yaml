appId: com.mishanaer.readany.dev
name: iOS profile switches to explicit dark theme
---
- launchApp:
    stopApp: false
- assertVisible: "Profile"
- tapOn: "System"
- extendedWaitUntil:
    visible: "Dark"
    timeout: 10000
- tapOn: "Dark"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-profile-explicit-dark
