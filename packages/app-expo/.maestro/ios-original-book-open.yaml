appId: com.mishanaer.readany.dev
name: iOS existing library book saved-position and controls inspection
# Does not turn pages or change this pre-existing book's settings.
---
- launchApp
- extendedWaitUntil:
    visible: "Library"
    timeout: 30000
- runFlow:
    file: flows/ios-open-fixture.yaml
    env:
      BOOK_TITLE: "Преступление и наказание"
      PAGE_LABEL: "Narra Reader"
- extendedWaitUntil:
    notVisible: "Listen"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-original-book-restored
- tapOn:
    point: "50%,50%"
- takeScreenshot: ios-original-reader-controls
