appId: com.mishanaer.readany.dev
name: iOS repeat PDF note navigation on the same reader
---
- launchApp:
    stopApp: false
- assertVisible: "Narra Reader"
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            notVisible: "Book actions"
          commands:
            - tapOn:
                point: "50%,50%"
- tapOn: "Book actions"
- tapOn: "Notes"
- extendedWaitUntil:
    visible: ".*NARRA QA PDF page anchor final 20260905.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-repeat-note-before-physical-tap
# Verified own final note text is the second card, halfway down the sheet.
- tapOn:
    point: "50%,46%"
- extendedWaitUntil:
    visible: "p. 4 of 12"
    timeout: 15000
- takeScreenshot: ios-repeat-note-returned-page-four
