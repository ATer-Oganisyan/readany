appId: com.mishanaer.readany.dev
name: Prepare repeatable Android reader to characters transition
---
- runFlow:
    file: flows/android-open-fixture.yaml
    env:
      BOOK_TITLE: Аудит 14 - Новая редакция реки
- assertVisible: .*Анна.*
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible: Characters
    commands:
      - tapOn:
          point: 50%,40%
- extendedWaitUntil:
    visible: Characters
    timeout: 10000
- takeScreenshot: android-reader-ready-for-characters
