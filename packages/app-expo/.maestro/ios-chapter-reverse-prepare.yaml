appId: com.mishanaer.readany.dev
name: iOS save chapter one before cold reverse boundary check
---
- launchApp:
    stopApp: false
- assertVisible: "Narra Reader"
- runFlow:
    when:
      notVisible: "Book actions"
    commands:
      - tapOn:
          point: "50%,50%"
- tapOn: "Book actions"
- tapOn: "Table of Contents"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "42%,62%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-reverse-check-cold-anchor
