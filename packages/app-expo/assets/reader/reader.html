      } catch (err) {
        postToRN('error', { message: 'Navigate search failed: ' + String(err) });
      }
    }

    // ─── Settings ───
    function updateSettingsState(settings) {
      // Update custom font state
      if (settings.customFontFaceCSS !== undefined) {
        currentCustomFontFaceCSS = settings.customFontFaceCSS || '';
        injectCustomFontFace(currentCustomFontFaceCSS);
      }
      if (settings.customFontFamily !== undefined) {
        currentCustomFontFamily = settings.customFontFamily || '';
      }

      if (settings.fontSize !== undefined) {
        currentFontSize = settings.fontSize;
      }
      if (settings.lineHeight !== undefined) {
        currentLineHeight = settings.lineHeight;
      }
      if (settings.paragraphSpacing !== undefined) {
        currentParagraphSpacing = settings.paragraphSpacing;
      }
      if (settings.fontTheme !== undefined) {
        currentFontTheme = settings.fontTheme || 'default';
      }
      if (settings.paginatedLayout !== undefined) {
        currentPaginatedLayout =
          settings.paginatedLayout === 'single' ? 'single' : 'double';
      }
      if (settings.viewMode) {
        currentViewMode = settings.viewMode;
      }
    }

    function applySettings(settings) {
      if (settings !== currentSettings) Object.assign(currentSettings, settings);
      updateSettingsState(settings);
      if (!view || !view.renderer) return;
      const renderer = view.renderer;

      if (settings.fontSize !== undefined || settings.lineHeight !== undefined || settings.fontTheme !== undefined || settings.paragraphSpacing !== undefined
          || settings.customFontFamily !== undefined || settings.customFontFaceCSS !== undefined) {
        const fontThemes = {
          default: { cjk: '-apple-system, BlinkMacSystemFont, system-ui, sans-serif', serif: '-apple-system, BlinkMacSystemFont, system-ui, sans-serif' },
          system: { cjk: '-apple-system, BlinkMacSystemFont, system-ui, sans-serif', serif: '-apple-system, BlinkMacSystemFont, system-ui, sans-serif' },
          literata: { cjk: "'Noto Serif SC', 'Source Han Serif SC', serif", serif: "Literata, Georgia, serif" },
        };

        let fontFamily;
        if (currentCustomFontFamily) {
          fontFamily = cssString(currentCustomFontFamily);
        } else {
          const theme = fontThemes[currentFontTheme] || fontThemes.default;
          // For themes with multi-value font stacks (like system default), use as-is
          // For named font themes (like literata), wrap in quotes
          const needsQuotes = !theme.cjk.includes(',');
          if (needsQuotes) {
            fontFamily = "'" + theme.cjk + "', '" + theme.serif + "', serif";
          } else {
            fontFamily = theme.cjk;
          }
        }
        const fSize = currentFontSize;
        const lh = currentLineHeight;
        // paragraphSpacing/pageMargin are stored as px tuned at the
        // default 16px font size. Scale them with the actual font size so
        // spacing reads proportionally at large font sizes — without this
        // a 16px paragraphSpacing looks cramped at fontSize 64.
        // BASELINE matches defaultReadSettings.fontSize in core/stores/settings-store.ts.
        const BASELINE_FONT_SIZE = 16;
        const layoutScale = currentFontSize / BASELINE_FONT_SIZE;
        const ps = Math.round(currentParagraphSpacing * layoutScale);

        const baseStyles = `
          :root {
            --readany-font-family: ${fontFamily};
          }
          :root:not(.vrtl):not(.vltr),
          :root:not(.vrtl):not(.vltr) body {
            font-family: var(--readany-font-family) !important;
            font-size: ${fSize}px !important;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
          }
          :root body *:not(svg):not(svg *):not(math):not(math *) {
            font-family: var(--readany-font-family) !important;
          }
          :root:not(.vrtl):not(.vltr) body *:not(h1):not(h2):not(h3):not(h4):not(h5):not(h6):not(svg):not(svg *):not(math):not(math *):not(pre):not(pre *):not(code):not(code *):not(kbd):not(kbd *):not(samp):not(samp *):not(rt):not(rp) {
            font-size: ${fSize}px !important;
          }
          :root:is(.vrtl, .vltr),
          :root:is(.vrtl, .vltr) body {
            font-family: var(--readany-font-family) !important;
            font-size: ${fSize}px;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
          }
          :root:not(.vrtl):not(.vltr) p,
          :root:not(.vrtl):not(.vltr) div,
          :root:not(.vrtl):not(.vltr) blockquote,
          :root:not(.vrtl):not(.vltr) dd,
          :root:not(.vrtl):not(.vltr) li,
          :root:not(.vrtl):not(.vltr) span {
            font-size: ${fSize}px !important;
          }
          :root:not(.vrtl):not(.vltr) p,
          :root:not(.vrtl):not(.vltr) div,
          :root:not(.vrtl):not(.vltr) blockquote,
          :root:not(.vrtl):not(.vltr) dd,
          :root:not(.vrtl):not(.vltr) li,
          :root:not(.vrtl):not(.vltr) span {
            line-height: ${lh} !important;
          }
          :root:not(.vrtl):not(.vltr) h1,
          :root:not(.vrtl):not(.vltr) h2,
          :root:not(.vrtl):not(.vltr) h3,
          :root:not(.vrtl):not(.vltr) h4,
          :root:not(.vrtl):not(.vltr) h5,
          :root:not(.vrtl):not(.vltr) h6 {
            line-height: 1 !important;
          }
          :root:not(.vrtl):not(.vltr) p {
            margin-top: ${ps}px !important;
            margin-bottom: ${ps}px !important;
          }
          :root:not(.vrtl):not(.vltr) img,
          :root:not(.vrtl):not(.vltr) svg {
            max-width: 100% !important;
            height: auto !important;
          }
          ${getVerticalWritingCompatibilityStyles()}
        `;
        lastRendererStyles = baseStyles;
        const themedStyles = injectThemeIntoStyles(
          baseStyles,
          currentThemeColors.bg,
          currentThemeColors.fg,
          currentThemeColors.primary,
        );
        if (typeof renderer.setStyles === 'function') {
          renderer.setStyles(themedStyles);
        }
        syncReaderOverrideStylesForAllDocs(themedStyles);
        syncCustomFontStylesForAllDocs(currentCustomFontFaceCSS);
      }

      if (settings.pageMargin != null) {
        // Scale pageMargin with fontSize so the page edges stay
        // proportionally placed at large font sizes. Same baseline (16) as
        // the paragraphSpacing scaling above.
        const BASELINE_FONT_SIZE = 16;
        const layoutScale = currentFontSize / BASELINE_FONT_SIZE;
        const margin = Math.round(settings.pageMargin * layoutScale);
        const gapPercent = Math.max(1, Math.round((margin / 393) * 100));
        setRendererAttr(renderer, 'gap', gapPercent + '%');
        setRendererAttr(renderer, 'margin', margin + 'px');
      }

      if (view && view.isFixedLayout) {
        applyFixedLayoutRendererSettings(renderer, currentPaginatedLayout);
      }

      if (settings.viewMode) {
        currentViewMode = settings.viewMode;
        applyRendererFlowMode(renderer);
      }
    }

    function getScrollNavigationDistance() {
      if (!view || !view.renderer) return Math.max(1, window.innerHeight - 96);
      const size = Number(view.renderer.size || 0);
      const fallbackSize = window.innerHeight || document.documentElement.clientHeight || 720;
      return Math.max(1, (Number.isFinite(size) && size > 0 ? size : fallbackSize) - 96);
    }

    async function goNextByMode(distance) {
      if (!view) return;
      if (view.renderer && view.renderer.scrolled) {
        await view.next(Math.max(1, Number(distance || getScrollNavigationDistance())));
      } else {
        await view.next();
      }
    }

    async function goPrevByMode(distance) {
      if (!view) return;
      if (view.renderer && view.renderer.scrolled) {
        await view.prev(Math.max(1, Number(distance || getScrollNavigationDistance())));
      } else {
        await view.prev();
      }
    }

    function splitCustomFontCSS(css) {
      const importUrls = [];
      const fontFaceLines = [];
      for (const line of (css || '').split('\n')) {
        const trimmed = line.trim();
        if (trimmed.startsWith('@import')) {
          const url = trimmed
            .replace(/^@import\s+url\(['"]?/, '')
            .replace(/['"]?\);?\s*$/, '')
            .trim();
          if (url) importUrls.push(url);
        } else {
          fontFaceLines.push(line);
        }
      }
      return {
        importUrls,
        fontFaceCSS: fontFaceLines.join('\n').trim(),
      };
    }

    function cssString(value) {
      return JSON.stringify(String(value || ''));
    }

    function warmBundledReaderFontOnce() {
      if (bundledReaderFontWarmup) return bundledReaderFontWarmup;
      const familyName = String(currentCustomFontFamily || '').trim();
      if (!currentCustomFontFaceCSS || !familyName || !document.fonts || !document.fonts.load) {
        return null;
      }

      const family = cssString(familyName);
      try {
        bundledReaderFontWarmup = Promise.allSettled([
          document.fonts.load(`normal 400 16px ${family}`),
          document.fonts.load(`italic 400 16px ${family}`),
          document.fonts.load(`normal 700 16px ${family}`),
          document.fonts.load(`italic 700 16px ${family}`),
        ]).then((results) => {
          const unavailable = results.some(
            (result) => result.status === 'rejected' || result.value.length === 0
          );
          if (unavailable) {
            console.warn('[Reader] Some bundled SB Serif faces are unavailable; using fallback typography');
          }
        });
      } catch (fontError) {
        console.warn('[Reader] Failed to start bundled SB Serif warmup:', fontError);
        return null;
      }

      return bundledReaderFontWarmup;
    }

    async function waitForBundledReaderFontWarmup() {
      const warmup = warmBundledReaderFontOnce();
      if (!warmup) return;

      let timeoutId = null;
      await Promise.race([
        warmup,
        new Promise((resolve) => {
          timeoutId = setTimeout(resolve, BUNDLED_READER_FONT_WARMUP_TIMEOUT_MS);
        }),
      ]);
      if (timeoutId !== null) clearTimeout(timeoutId);
    }

    function syncCustomFontStylesForDoc(doc, css) {
      if (!doc || !doc.head) return;
      const { importUrls, fontFaceCSS } = splitCustomFontCSS(css);

      const existingLinks = Array.from(doc.querySelectorAll('link.__readany_css_font__'));
      const existingImportUrls = existingLinks.map((link) => link.getAttribute('href') || '');
      const importsChanged =
        existingImportUrls.length !== importUrls.length ||
        existingImportUrls.some((url, index) => url !== importUrls[index]);
      if (importsChanged) {
        existingLinks.forEach((el) => el.remove());
        for (const url of importUrls) {
          const link = doc.createElement('link');
          link.rel = 'stylesheet';
          link.href = url;
          link.className = '__readany_css_font__';
          doc.head.appendChild(link);
        }
      }

      const styleId = '__readany_custom_font_face__';
      let el = doc.getElementById(styleId);
      if (!el) {

    const BR_BLOCK_TAGS = new Set([

        const visibleRange = getVisibleRangeForTTSDoc(doc, renderer);
        return visibleRange ? rectIntersectsPaginatedRange(rect, visibleRange) : false;
      }
      return isHostRectVisible(mapIframeRectToHost(rect, doc));
    }

    function isRangeVisibleInReader(range, renderer, win) {
      if (!range || !renderer || !win) return false;
      try {
        const rects = Array.from(range.getClientRects ? range.getClientRects() : []);
        const doc = getRangeDocument(range);
        if (!rects.length) {
          return isRectVisibleInReader(range.getBoundingClientRect(), renderer, win, doc);
        }
        return rects.some((rect) => isRectVisibleInReader(rect, renderer, win, doc));
      } catch (e) {
        console.log('[visibleTTSSegments] failed to inspect range rects:', e);
        return false;
      }
    }

    function isRangeStartVisibleInReader(range, renderer, win) {
      if (!range || !renderer || !win) return false;
      try {
        const rects = Array.from(range.getClientRects ? range.getClientRects() : []);
        const doc = getRangeDocument(range);
        if (!rects.length) {
          return isRectVisibleInReader(range.getBoundingClientRect(), renderer, win, doc);
        }
        return isRectVisibleInReader(rects[0], renderer, win, doc);
      } catch (e) {
        console.log('[visibleTTSSegments] failed to inspect range start rect:', e);
        return false;
      }
    }

    function getVisibleBlocksForTTS(doc, renderer) {
      const blockSelector = "p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, pre, td, th";
      const blocks = doc.querySelectorAll(blockSelector);
      const win = doc.defaultView;
      if (!win) return [];
      return Array.from(blocks).filter((block) => {
        if (!block || !block.textContent || !block.textContent.trim()) return false;
        if (shouldSkipTTSNode(block)) return false;
        try {
          const range = doc.createRange();
          range.selectNodeContents(block);
          return isRangeVisibleInReader(range, renderer, win);
        } catch (e) {
          return isRectVisibleInReader(block.getBoundingClientRect(), renderer, win, doc);
        }
      });
    }

    const TTS_BLOCK_SELECTOR = "p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, pre, td, th";
    function getReadableBlocksForTTS(doc) {
      const blockSelector = TTS_BLOCK_SELECTOR;
      return Array.from(doc.querySelectorAll(blockSelector)).filter((block) => {
        if (!block || !block.textContent || !block.textContent.trim()) return false;
        if (shouldSkipTTSNode(block)) return false;
        return true;
      });
    }

    function resolveTextPosition(textNodes, absoluteOffset, isEnd) {
      if (!textNodes.length) return null;
      for (var i = 0; i < textNodes.length; i++) {
        var item = textNodes[i];
        if (absoluteOffset < item.end || (isEnd && absoluteOffset <= item.end)) {
          return {
            node: item.node,
            offset: Math.max(0, Math.min(item.node.nodeValue.length, absoluteOffset - item.start)),

      const last = textNodes[textNodes.length - 1];

    function fallbackSentenceSegments(text) {
      const normalized = normalizeTTSText(text);
      if (!normalized) return [];
      const matches = normalized.match(/[^。！？!?；;\n]+[。！？!?；;…]?/gu) || [];
      return (matches.length ? matches : [normalized]).map((segment) => segment.trim()).filter(Boolean);
    }

    const TTS_FOOTNOTE_MARKER_PATTERN = /(?:\s*(?:\[(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\]|［(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})］|【(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})】|〔(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})〕|［?（(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})）］?|\((?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\)))+/gu;
    const TTS_FOOTNOTE_MARKER_ONLY_PATTERN = /^(?:\s*(?:\[(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\]|［(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})］|【(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})】|〔(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})〕|［?（(?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})）］?|\((?:\d{1,4}|[一二三四五六七八九十百千万零〇两]{1,8}|[ivxlcdmIVXLCDM]{1,10})\)))+\s*$/u;
    const TTS_SKIPPED_ELEMENT_SELECTOR = [
      'script',
      'style',
      'rt',
      'rp',
      'sup',
      '.readany-translation',
      '.readany-scene-insert',
      '[role="doc-noteref"]',
      '[role="doc-footnote"]',
      '[epub\\:type~="noteref"]',
      '[epub\\:type~="footnote"]',
      '[type~="noteref"]',
      '[type~="footnote"]',
      'a[href^="#fn"]',
      'a[href^="#footnote"]',
      'a[href*="footnote"]',
      'a[href*="note"]',
      'a.noteref',
      'a.footnote',
      '.noteref',
      '.footnote',
      '.footnote-ref',
      '.endnote',
      '.duokan-footnote',
      '.calibre-footnote',
    ].join(',');

    function normalizeTTSText(text) {
      const normalized = String(text || '').replace(TTS_FOOTNOTE_MARKER_PATTERN, '').replace(/\s+/g, ' ').trim();
      return /[\p{L}\p{N}]/u.test(normalized) ? normalized : '';
    }

    function isTTSFootnoteMarker(text) {
      return TTS_FOOTNOTE_MARKER_ONLY_PATTERN.test(String(text || ''));
    }

    function shouldSkipTTSNode(element) {
      return !!(element && element.closest && element.closest(TTS_SKIPPED_ELEMENT_SELECTOR));
    }

    function stripCfiAssertions(value) {
      return String(value || '').replace(/\[[^\]]*\]/g, '');
    }

    function getTTSCfiStartIdentity(cfi) {
      const raw = String(cfi || '').trim();
      if (!raw) return '';
      const inner = raw.startsWith('epubcfi(') && raw.endsWith(')')
        ? raw.slice(8, -1)
        : raw;
      const bangIndex = inner.indexOf('!');
      if (bangIndex < 0) return stripCfiAssertions(inner);

      const sectionPath = stripCfiAssertions(inner.slice(0, bangIndex));
      const localPath = stripCfiAssertions(inner.slice(bangIndex + 1));
      const commaIndex = localPath.indexOf(',');
      if (commaIndex < 0) return `${sectionPath}!${localPath}`;

      const commonPath = localPath.slice(0, commaIndex);
      const rangePath = localPath.slice(commaIndex + 1);
      const rangeEndIndex = rangePath.indexOf(',');
      const startPath = rangeEndIndex >= 0 ? rangePath.slice(0, rangeEndIndex) : rangePath;
      return `${sectionPath}!${commonPath}${startPath}`;
    }

    function getTTSSegmentIdentity(cfi, text) {
      return `${getTTSCfiStartIdentity(cfi)}::${normalizeTTSText(text)}`;
    }

    function summarizeTTSSegmentsForLog(segments, limit) {
      return (segments || []).slice(0, limit || 8).map(function(segment, index) {
        var text = normalizeTTSText(segment && segment.text);
        return {
          index: index,
          cfi: segment && segment.cfi || null,
          length: text.length,
          text: text,
        };
      });
    }

    function getTTSParagraphId(doc, index, range) {
      try {
        const node = range.startContainer;
        const element = node.nodeType === 3 ? node.parentElement : node;
        const block = element.closest(TTS_BLOCK_SELECTOR);
        if (!block) return undefined;
        const paragraphRange = doc.createRange();
        paragraphRange.selectNodeContents(block);
        return view.getCFI(index, paragraphRange);
      } catch { return undefined; }
    }

    function getTTSParagraphIdFromCfi(cfi) {
      const resolved = resolveRangeForCfi(cfi);
      return resolved ? getTTSParagraphId(resolved.doc, resolved.index, resolved.range) : undefined;
    }

    function collectTTSSegmentsFromEngine(count, alignCfi, alignRange) {
      const tts = view && view.tts;
      if (!tts) return [];

      // Prefer range-based alignment (reliable boundary comparison) over CFI string
      // matching (fragile — depends on exact serialization equality).
      if (alignRange && typeof tts.from === 'function') {
        try {
          // tts.from() uses `range.end <= detailRange.start` comparison.
          // If we pass a full sentence range, range.end overshoots detailRange[0].start
          // and skips the first sentence. Collapse to start (caret) so the comparison
          // correctly lands on the sentence that CONTAINS the visible position.
          const caretRange = alignRange.cloneRange ? alignRange.cloneRange() : alignRange;
          if (caretRange.collapse) caretRange.collapse(true); // collapse to start
          tts.from(caretRange);
        } catch (e) {
          console.log('[visibleTTSSegments] tts.from() failed, falling back to alignCfi:', e);
          // fall through to CFI alignment below
          if (alignCfi && typeof tts.alignCfi === 'function') {
            try { tts.alignCfi(alignCfi); } catch {}
          }
        }
      } else if (alignCfi) {
        try {
          if (typeof tts.alignCfi === 'function') {
            tts.alignCfi(alignCfi);
          } else if (typeof tts.highlightCfi === 'function') {
            tts.highlightCfi(alignCfi);
          }
        } catch (e) {
          console.log('[visibleTTSSegments] failed to align tts detail cursor:', e);
        }
      }

      const total = Math.max(1, Number.isFinite(count) ? count : 1);
      const current =
        typeof tts.currentDetail === 'function'
          ? tts.currentDetail()
          : null;
      const following =
        typeof tts.collectDetails === 'function'
          ? tts.collectDetails(Math.max(0, total - (current ? 1 : 0)), {
              includeCurrent: false,
              offset: 1,
            })
          : [];

      const result = [];
      const seen = new Set();
      for (const detail of [current, ...(following || [])]) {
        if (!detail || !detail.text || !detail.cfi) continue;
        const text = normalizeTTSText(detail.text);
        const identity = getTTSSegmentIdentity(detail.cfi, text);
        if (!text || seen.has(identity)) continue;
        seen.add(identity);
        result.push({ text, cfi: detail.cfi, paragraphId: getTTSParagraphIdFromCfi(detail.cfi) });
      }
      return result;
    }

    function getTTSSegmentContextFromEngine(cfi, beforeCount, afterCount) {
      try {
        const tts = view && view.tts;
        if (!tts || !cfi) return { before: [], after: [] };

        const resolved = resolveRangeForCfi(cfi);
        try {
          if (resolved?.range && typeof tts.from === 'function') {
            const caretRange = resolved.range.cloneRange ? resolved.range.cloneRange() : resolved.range;
            if (caretRange.collapse) caretRange.collapse(true);
            tts.from(caretRange);
          } else if (typeof tts.alignCfi === 'function') {
            tts.alignCfi(cfi);
          } else if (typeof tts.highlightCfi === 'function') {
            tts.highlightCfi(cfi);
          }
        } catch (e) {
          console.log('[ttsSegmentContext] failed to align cfi:', e);
          return { before: [], after: [] };
        }

        const current =
          typeof tts.currentDetail === 'function'
            ? tts.currentDetail()
            : null;
        const currentText =
          current && current.text
            ? normalizeTTSText(current.text)
            : '';
        const currentIdentity = currentText ? getTTSSegmentIdentity(current && current.cfi, currentText) : null;

        const normalize = function(details) {
          const result = [];
          const seen = new Set();
          for (const detail of details || []) {
            if (!detail || !detail.text || !detail.cfi) continue;
            const text = normalizeTTSText(detail.text);
            const identity = getTTSSegmentIdentity(detail.cfi, text);
            if (!text || (currentIdentity && identity === currentIdentity) || seen.has(identity)) continue;
            seen.add(identity);
            result.push({ text, cfi: detail.cfi, paragraphId: getTTSParagraphIdFromCfi(detail.cfi) });
          }
          return result;
        };

        const before =
          typeof tts.collectDetails === 'function'
            ? tts.collectDetails(Math.max(0, beforeCount || 0), {
                includeCurrent: false,
                offset: -Math.max(0, beforeCount || 0),
              })
            : [];
        const after =
          typeof tts.collectDetails === 'function'
            ? tts.collectDetails(Math.max(0, afterCount || 0), {
                includeCurrent: false,
                offset: 1,
              })
            : [];

        return {
          before: normalize(before),
          after: normalize(after),
        };
      } catch (e) {
        console.log('[ttsSegmentContext] error:', e);
        return { before: [], after: [] };
      }
    }

    function getTTSSegmentBoundaryNode(range, docNode) {
      if (!range || !range.startContainer) return null;
      const container = range.startContainer;
      if (container.nodeType === docNode.TEXT_NODE) {
        return container.parentElement;
      }
      if (
        container.childNodes &&
        Number.isInteger(range.startOffset) &&
        range.startOffset >= 0 &&
        range.startOffset < container.childNodes.length
      ) {
        const child = container.childNodes[range.startOffset];
        return child.nodeType === docNode.TEXT_NODE ? child.parentElement : child;
      }
      return container;
    }

    function extractTTSSegmentsFromDocument(
      doc,
      sectionIndex,
      maxCount,
      anchorRange,
      endAnchorRange,
      visibilityRange,
    ) {
      try {
        if (!doc || !view || typeof view.getCFI !== 'function') return [];
        const blocks = getReadableBlocksForTTS(doc);
        const lang =
          doc.documentElement.lang ||
          doc.documentElement.getAttribute('xml:lang') ||
          (doc.body && doc.body.lang) ||
          navigator.language ||
          'en';
        const segmenter =
          typeof Intl !== 'undefined' && Intl.Segmenter
            ? new Intl.Segmenter(lang, { granularity: 'sentence' })
            : null;
        const limit = Math.max(1, maxCount || 24);
        const segments = [];
        const seen = new Set();
        const docNode = doc.defaultView && doc.defaultView.Node ? doc.defaultView.Node : Node;
        const anchorNode = getTTSSegmentBoundaryNode(anchorRange, docNode);
        const endAnchorNode = getTTSSegmentBoundaryNode(endAnchorRange, docNode);
        const visibilityStart = visibilityRange ? visibilityRange.cloneRange() : null;
        const visibilityEnd = visibilityRange ? visibilityRange.cloneRange() : null;
        if (visibilityStart) visibilityStart.collapse(true);
        if (visibilityEnd) visibilityEnd.collapse(false);
        const rangeCtor = doc.defaultView && doc.defaultView.Range
          ? doc.defaultView.Range
          : Range;
        let started = !anchorNode;

        for (const block of blocks) {
          if (!started && anchorNode) {
            if (block === anchorNode || block.contains(anchorNode)) {
              started = true;
            } else if (
              anchorNode.compareDocumentPosition &&
              (anchorNode.compareDocumentPosition(block) & docNode.DOCUMENT_POSITION_FOLLOWING)
            ) {
              started = true;
            }
          }
          if (!started) continue;
          if (endAnchorNode) {
            const reachedEndAnchor =
              block === endAnchorNode ||
              block.contains(endAnchorNode) ||
              (endAnchorNode.contains && endAnchorNode.contains(block));
            const passedEndAnchor =
              endAnchorNode.compareDocumentPosition &&
              (endAnchorNode.compareDocumentPosition(block) &
                docNode.DOCUMENT_POSITION_FOLLOWING);
            if (reachedEndAnchor || passedEndAnchor) break;
          }

          const textNodes = getTTSTextNodes(block).map((node) => {
            const text = node.nodeValue || '';
            return { node, text };
          }).filter((item) => item.text.trim().length > 0);
          if (!textNodes.length) continue;

          let absoluteText = '';
          const positionedNodes = textNodes.map((item) => {
            const start = absoluteText.length;
            absoluteText += item.text;
            return {
              node: item.node,
              start,
              end: absoluteText.length,
            };
          });

          const rawSegments = segmenter
            ? Array.from(segmenter.segment(absoluteText)).map((item) => ({
                start: item.index,
                end: item.index + item.segment.length,
              }))
            : fallbackSentenceSegments(absoluteText).reduce((acc, sentence) => {
                const start = absoluteText.indexOf(sentence, acc.lastIndex || 0);
                if (start >= 0) {
                  acc.items.push({ start, end: start + sentence.length });
                  acc.lastIndex = start + sentence.length;
                }
                return acc;
              }, { items: [], lastIndex: 0 }).items;
          const normalizedSegments = rawSegments.length
            ? rawSegments
            : [{ start: 0, end: absoluteText.length }];

          for (const rawSegment of normalizedSegments) {
            let start = rawSegment.start;
            let end = rawSegment.end;
            while (start < end && /\s/u.test(absoluteText[start])) start++;
            while (end > start && /\s/u.test(absoluteText[end - 1])) end--;
            if (end - start < 2) continue;

            const startPos = resolveTextPosition(positionedNodes, start, false);
            const endPos = resolveTextPosition(positionedNodes, end, true);
            if (!startPos || !endPos) continue;

            const range = doc.createRange();
            range.setStart(startPos.node, startPos.offset);
            range.setEnd(endPos.node, endPos.offset);

            if (visibilityStart && visibilityEnd) {
              const sentenceStart = range.cloneRange();
              sentenceStart.collapse(true);
              if (
                sentenceStart.compareBoundaryPoints(rangeCtor.START_TO_START, visibilityStart) < 0
              ) {
                continue;
              }
              if (
                sentenceStart.compareBoundaryPoints(rangeCtor.START_TO_START, visibilityEnd) >= 0
              ) {
                return segments;
              }
            }

            const text = normalizeTTSText(absoluteText.slice(start, end));
            if (!text) continue;

            try {
              const cfi = view.getCFI(sectionIndex, range);
              const identity = getTTSSegmentIdentity(cfi, text);
              if (!cfi || seen.has(identity)) continue;
              seen.add(identity);
              const paragraphId = getTTSParagraphId(doc, sectionIndex, range);
              segments.push({ text, cfi, paragraphId });
              if (segments.length >= limit) return segments;
            } catch (e) {
              console.log('[hrefTTSSegments] failed to convert range to CFI:', e);
            }
          }
        }

        return segments;
      } catch (e) {
        console.log('[hrefTTSSegments] extract error:', e);
        return [];
      }
    }

    async function resolveHrefForTTSSegments(href) {
      if (!href || !currentBook || !currentBook.sections || !view) {
        return { resolved: null, sectionIndex: -1 };
      }

      let resolved = null;
      try {
        if (typeof view.resolveNavigation === 'function') {
          resolved = await Promise.resolve(view.resolveNavigation(href));
        } else if (typeof currentBook.resolveHref === 'function') {
          resolved = await Promise.resolve(currentBook.resolveHref(href));
        }
      } catch (e) {
        console.log('[hrefTTSSegments] failed to resolve href:', href, e);
      }

      let sectionIndex = Number.isInteger(resolved && resolved.index) ? resolved.index : -1;
      if (sectionIndex < 0) {
        const hrefWithoutHash = String(href).split('#')[0];
        sectionIndex = Array.from(currentBook.sections).findIndex(function(section) {
          const sectionHref = String(section && section.href || '').split('#')[0];
          return (
            sectionHref === href ||
            sectionHref === hrefWithoutHash ||
            sectionHref.endsWith('/' + hrefWithoutHash)
          );
        });
      }

      return { resolved, sectionIndex };
    }

    async function getChapterTTSSegmentsFromBook(startHref, endHref, maxCount) {
      try {
        if (!startHref || !currentBook || !currentBook.sections || !view) return [];
        const startLocation = await resolveHrefForTTSSegments(startHref);
        const resolved = startLocation.resolved;
        const sectionIndex = startLocation.sectionIndex;
        if (sectionIndex < 0 || sectionIndex >= currentBook.sections.length) return [];
        const endLocation = endHref && String(endHref) !== String(startHref)
          ? await resolveHrefForTTSSegments(endHref)
          : null;
        const lastSection = endLocation ? endLocation.sectionIndex : currentBook.sections.length - 1;
        const limit = Number.isFinite(maxCount) ? Math.max(0, Math.floor(maxCount)) : 24;
        if (lastSection < sectionIndex || !limit) return [];
        const segments = [];
        for (let index = sectionIndex; index <= lastSection; index++) {
          const section = currentBook.sections[index];
          if (!section || typeof section.createDocument !== 'function') return [];
          const doc = await section.createDocument();
          const start = index === sectionIndex && typeof resolved?.anchor === 'function'
            ? anchorToRange(doc, resolved.anchor(doc)) : null;
          const end = index === lastSection && typeof endLocation?.resolved?.anchor === 'function'
            ? anchorToRange(doc, endLocation.resolved.anchor(doc)) : null;
          // A following chapter at a new document's start contributes no text.
          if (endLocation && index === lastSection && index > sectionIndex && !end) break;
          segments.push(...extractTTSSegmentsFromDocument(
            doc, index, limit - segments.length, start, end,
          ));
          if (segments.length >= limit) break;
        }
        return segments;
      } catch (e) {
        console.log('[chapterTTSSegments] error:', e);
        return [];
      }
    }

    async function getHrefTTSSegmentsFromBook(href, maxCount) {
      return getChapterTTSSegmentsFromBook(href, null, maxCount);
    }

    async function getSectionTTSSegmentsFromBook(sectionIndex, maxCount) {
      try {
        if (!currentBook || !currentBook.sections || !view) return [];
        const index = Number(sectionIndex);
        if (!Number.isInteger(index) || index < 0 || index >= currentBook.sections.length) {
          return [];
        }

        const section = currentBook.sections[index];
        if (!section || typeof section.createDocument !== 'function') return [];

        const doc = await section.createDocument();
        return extractTTSSegmentsFromDocument(doc, index, maxCount, null, null);
      } catch (e) {
        console.log('[sectionTTSSegments] error:', e);
        return [];
      }
    }

    function extractVisibleTTSSegments(alignCfi) {
      try {
        const renderer = view && view.renderer;
        const contents = getRendererContents();
        if (!renderer || !contents.length) return [];

        // Relocation CFIs are ranges spanning the page that is actually on
        // screen. Prefer that exact DOM range when the native reader supplies
        // it: it remains correct across paginator implementations and avoids
        // accidentally selecting an adjacent mounted column.
        const resolvedVisiblePage = alignCfi ? resolveRangeForCfi(alignCfi) : null;
        if (
          resolvedVisiblePage?.doc &&
          resolvedVisiblePage.range &&
          !resolvedVisiblePage.range.collapsed
        ) {
          const rangeSegments = extractTTSSegmentsFromDocument(
            resolvedVisiblePage.doc,
            resolvedVisiblePage.index,
            500,
            resolvedVisiblePage.range,
            null,
            resolvedVisiblePage.range,
          );
          if (rangeSegments.length > 0) {
            window.__lastVisibleTTSDiagnostics = {
              alignCfi: alignCfi,
              firstVisibleCfi: rangeSegments[0]?.cfi || null,
              firstVisibleText: rangeSegments[0]?.text || null,
              directCount: rangeSegments.length,
              alignedCount: rangeSegments.length,
              filteredAlignedCount: rangeSegments.length,
              returnedCount: rangeSegments.length,
              returnSource: 'relocation-page-range',
              stats: { startVisibilityMode: 'relocation-page-range' },
              directPreview: summarizeTTSSegmentsForLog(rangeSegments, 8),
              alignedPreview: summarizeTTSSegmentsForLog(rangeSegments, 8),
              filteredAlignedPreview: summarizeTTSSegmentsForLog(rangeSegments, 8),
              returnedPreview: summarizeTTSSegmentsForLog(rangeSegments, 8),
            };
            return rangeSegments;
          }
        }

        ttsVisibleRangeByDoc = new WeakMap();
        const scanContents = getVisibleContentsForTTS(contents, renderer);
        const segments = [];
        const stats = {
          contentsCount: contents.length,
          scannedContentsCount: scanContents.length,
          visibleBlockCount: 0,
          rawSentenceCount: 0,
          skippedTooShort: 0,
          skippedNoBoundary: 0,
          skippedNotStartVisible: 0,
          skippedNotVisible: 0,
          skippedEmptyText: 0,
          skippedCFI: 0,
          skippedDuplicate: 0,
          startVisibilityMode: 'range-intersection',
        };
        const seenVisibleIdentities = new Set();
        // Track the first visible range for range-based TTS cursor alignment
        // Must be declared here (outer scope) so it's accessible after both loops close.
        let firstVisibleRange = null;

        for (var contentIndex = 0; contentIndex < scanContents.length; contentIndex++) {
          const current = scanContents[contentIndex];
          if (!current || !current.doc) continue;
          const doc = current.doc;
          const win = doc.defaultView;
          if (!win) continue;
          const sectionIndex = typeof current.index === 'number' ? current.index : currentSectionIndex;
          const visibleBlocks = getVisibleBlocksForTTS(doc, renderer);
          stats.visibleBlockCount += visibleBlocks.length;
          const lang =
            doc.documentElement.lang ||
            doc.documentElement.getAttribute('xml:lang') ||
            doc.body.lang ||
            navigator.language ||
            'en';
          const segmenter =
            typeof Intl !== 'undefined' && Intl.Segmenter
              ? new Intl.Segmenter(lang, { granularity: 'sentence' })
              : null;

          for (var blockIndex = 0; blockIndex < visibleBlocks.length; blockIndex++) {
            const block = visibleBlocks[blockIndex];
            const textNodes = getTTSTextNodes(block).map((node) => {
              const text = node.nodeValue || '';
              return { node, text };
            }).filter((item) => item.text.trim().length > 0);
            if (!textNodes.length) continue;

            var absoluteText = '';
            const positionedNodes = textNodes.map((item) => {
              const start = absoluteText.length;
              absoluteText += item.text;
              return {
                node: item.node,
                start,
                end: absoluteText.length,
              };
            });

            const rawSegments = segmenter
              ? Array.from(segmenter.segment(absoluteText)).map((item) => ({
                  start: item.index,
                  end: item.index + item.segment.length,
                }))
              : fallbackSentenceSegments(absoluteText).reduce((acc, sentence) => {
                  const start = absoluteText.indexOf(sentence, acc.lastIndex || 0);
                  if (start >= 0) {
                    acc.items.push({ start, end: start + sentence.length });
                    acc.lastIndex = start + sentence.length;
                  }
                  return acc;
                }, { items: [], lastIndex: 0 }).items;

            const normalizedSegments = rawSegments.length
              ? rawSegments
              : [{ start: 0, end: absoluteText.length }];
            stats.rawSentenceCount += normalizedSegments.length;

            for (var si = 0; si < normalizedSegments.length; si++) {
              let start = normalizedSegments[si].start;
              let end = normalizedSegments[si].end;

              while (start < end && /\s/u.test(absoluteText[start])) start++;
              while (end > start && /\s/u.test(absoluteText[end - 1])) end--;
              if (end - start < 2) {
                stats.skippedTooShort++;
                continue;
              }

              const startPos = resolveTextPosition(positionedNodes, start, false);
              const endPos = resolveTextPosition(positionedNodes, end, true);
              if (!startPos || !endPos) {
                stats.skippedNoBoundary++;
                continue;
              }

              const range = doc.createRange();
              range.setStart(startPos.node, startPos.offset);
              range.setEnd(endPos.node, endPos.offset);
              if (!isRangeStartVisibleInReader(range, renderer, win)) {
                stats.skippedNotVisible++;
                stats.skippedNotStartVisible++;
                continue;
              }

              const text = normalizeTTSText(absoluteText.slice(start, end));
              if (!text) {
                stats.skippedEmptyText++;
                continue;
              }

              // Capture the first visible range for reliable TTS cursor alignment
              if (!firstVisibleRange) {
                firstVisibleRange = range;
              }

              try {
                const cfi = view && view.getCFI ? view.getCFI(sectionIndex, range) : '';
                if (cfi) {
                  const identity = getTTSSegmentIdentity(cfi, text);
                  if (seenVisibleIdentities.has(identity)) {
                    stats.skippedDuplicate++;
                    continue;
                  }
                  seenVisibleIdentities.add(identity);
                  segments.push({ text, cfi });
                } else {
                  stats.skippedCFI++;
                }
              } catch (e) {
                stats.skippedCFI++;
                console.log('[visibleTTSSegments] failed to convert range to CFI:', e);
              }
            }
          }
        }

        // Use range-based alignment (preferred: uses boundary comparison, not CFI string equality)
        // Fall back to CFI string alignment for older tts.js builds without tts.from()
        const firstVisibleCfi = segments[0]?.cfi || null;
        const resolvedAlignRange = resolveRangeForCfi(alignCfi);
        const alignedSegments = segments.length
          ? collectTTSSegmentsFromEngine(
              alignCfi ? 500 : segments.length,
              alignCfi || firstVisibleCfi,
              resolvedAlignRange?.range || firstVisibleRange
            )
          : [];
        let returnSource = segments.length ? 'direct-visible' : 'no-visible-segments';
        let filteredAlignedCount = 0;
        let filteredAlignedPreview = [];
        let returnedSegments = segments;
        if (alignedSegments.length && segments.length) {
          const visibleIdentities = new Set(
            segments.map((segment) => getTTSSegmentIdentity(segment.cfi, segment.text))
          );
          const filtered = alignedSegments.filter((segment) =>
            visibleIdentities.has(getTTSSegmentIdentity(segment.cfi, segment.text))
          );
          filteredAlignedCount = filtered.length;
          filteredAlignedPreview = summarizeTTSSegmentsForLog(filtered, 8);
          if (filtered.length === segments.length) {
            returnSource = 'aligned-filtered';
            returnedSegments = filtered;
          } else if (filtered.length > 0) {
            returnSource = 'direct-partial-filtered-fallback';
            returnedSegments = segments;
          } else if (alignCfi) {
            const alignedStart = alignedSegments[0] || null;
            const alignedStartIdentity = alignedStart
              ? getTTSSegmentIdentity(alignedStart.cfi, alignedStart.text)
              : null;
            const visibleStartIndex = alignedStartIdentity
              ? segments.findIndex(
                  (segment) =>
                    getTTSSegmentIdentity(segment.cfi, segment.text) === alignedStartIdentity
                )
              : -1;
            if (visibleStartIndex >= 0) {
              returnSource = 'direct-aligned-slice';
              returnedSegments = segments.slice(visibleStartIndex);
            } else {
              returnSource = 'direct-fallback';
              returnedSegments = segments;
            }
          } else {
            returnSource = 'direct-visible';
            returnedSegments = segments;
          }
        }

        window.__lastVisibleTTSDiagnostics = {
          alignCfi: alignCfi || null,
          firstVisibleCfi: firstVisibleCfi,
          firstVisibleText: segments[0] && segments[0].text || null,
          directCount: segments.length,
          alignedCount: alignedSegments.length,
          filteredAlignedCount: filteredAlignedCount,
          returnedCount: returnedSegments.length,
          returnSource: returnSource,
          stats: stats,
          directPreview: summarizeTTSSegmentsForLog(segments, 8),
          alignedPreview: summarizeTTSSegmentsForLog(alignedSegments, 8),
          filteredAlignedPreview: filteredAlignedPreview,
          returnedPreview: summarizeTTSSegmentsForLog(returnedSegments, 8),
        };
        console.log('[visibleTTSSegments] diagnostics', JSON.stringify(window.__lastVisibleTTSDiagnostics));
        return returnedSegments;
      } catch (e) {
        console.log('[visibleTTSSegments] extraction error:', e);
        const fallbackSegments = alignCfi
          ? collectTTSSegmentsFromEngine(500, alignCfi, resolveRangeForCfi(alignCfi)?.range || null)
          : [];
        window.__lastVisibleTTSDiagnostics = {
          alignCfi: alignCfi || null,
          extractionError: String(e),
          returnSource: alignCfi ? 'engine-align-fallback' : 'no-visible-segments',
          directCount: 0,
          alignedCount: fallbackSegments.length,
          filteredAlignedCount: 0,
          returnedCount: fallbackSegments.length,
          stats: {
            startVisibilityMode: 'range-intersection',
          },
          directPreview: [],
          alignedPreview: summarizeTTSSegmentsForLog(fallbackSegments, 8),
          filteredAlignedPreview: [],
          returnedPreview: summarizeTTSSegmentsForLog(fallbackSegments, 8),
        };
        console.log('[visibleTTSSegments] diagnostics', JSON.stringify(window.__lastVisibleTTSDiagnostics));
        return fallbackSegments;
      }
    }

          } catch (e2) {}
        }
        return;

          await view.deleteAnnotation({ value: cfi });

    // ─── Polyfills ───
    Object.groupBy ??= function (iterable, fn) {

      let i = 0;
      for (const v of iterable) { const k = fn(v, i++); if (k in obj) obj[k].push(v); else obj[k] = [v]; }
      return obj;
    };
    Map.groupBy ??= function (iterable, fn) {
      const map = new Map();
      let i = 0;

    // ─── Chapter Extraction for Vectorization ───
    function isPDFBookMessage(msg) {
      const mimeType = (msg.mimeType || '').split(';')[0].trim().toLowerCase();
      return mimeType === 'application/pdf' || /\.pdf$/i.test(msg.fileName || '');
    }

    async function createBookFileFromMessage(msg) {
      if (msg.base64) {
        const binary = atob(msg.base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new File([bytes], msg.fileName || 'book.epub', {
          type: msg.mimeType || 'application/epub+zip'
        });
      }

      if (msg.uri) {
        const res = await fetch(msg.uri);
        const isLocalFileStatus = res.status === 0 && /^file:\/\//i.test(msg.uri);
        if (!res.ok && !isLocalFileStatus) throw new Error(`Failed to fetch: ${res.status}`);
        const blob = await res.blob();
        return new File([blob], msg.fileName || 'book.epub', {
          type: msg.mimeType || blob.type || 'application/octet-stream'
        });
      }

      throw new Error('No book data provided');
    }

    async function handleExtractBookChapters(msg) {
      try {
        if (isPDFBookMessage(msg)) {
          if (typeof window._extractPDFChapters !== 'function') {
            throw new Error('PDF extraction is not available in this reader build');
          }

          postToRN('debug', {
            message: `[PDFExtract] start ${JSON.stringify({
              fileName: msg.fileName || '',
              mimeType: msg.mimeType || '',
              base64Length: msg.base64 ? msg.base64.length : 0
            })}`
          });

          const file = await createBookFileFromMessage(msg);
          const chapters = await window._extractPDFChapters(file, {
            onProgress: (detail) => {
              postToRN('debug', { message: `[PDFExtract] page ${JSON.stringify(detail)}` });
            }
          });

          postToRN('debug', {
            message: `[PDFExtract] done ${JSON.stringify({
              chapters: chapters.length,
              segments: chapters.reduce((sum, chapter) => sum + (chapter.segments?.length || 0), 0),
              contentLength: chapters.reduce((sum, chapter) => sum + (chapter.content?.length || 0), 0)
            })}`
          });

          postToRN('chaptersExtracted', { chapters });
          return;
        }

        currentBook = await makeBook(await createBookFileFromMessage(msg));
        await handleExtractChapters();
      } catch (err) {
        console.error('[WebView] Error extracting book chapters:', err);
        postToRN('chaptersExtracted', { error: String(err) });
      }
    }

    function normalizeBookTextSample(text) {
      return String(text || '')
        .replace(/\u00ad/g, '')
        .replace(/[ \t\f\v]+/g, ' ')
        .replace(/\n\s*\n\s*\n+/g, '\n\n')
        .trim();
    }

    async function createBookForTextSample(msg) {
      if (!msg.uri) throw new Error('A book URI is required for text sampling');
      if (isPDFBookMessage(msg) && typeof window._makePDFFromURL === 'function') {
        return window._makePDFFromURL(msg.uri, msg.fileName || 'book.pdf');
      }
      return makeBook(await createBookFileFromMessage({ ...msg, base64: undefined }));
    }

    async function extractSectionTextSample(section) {
      if (!section || typeof section.createDocument !== 'function') return '';
      const doc = await section.createDocument();
      try {
        return normalizeBookTextSample(doc.body?.innerText || doc.body?.textContent || '');
      } finally {
        if (doc.documentElement) doc.documentElement.innerHTML = '';
      }
    }

    async function collectTextSampleRegion(sections, indices, budget, seen, reverseOutput) {
      if (budget <= 0) return '';
      const parts = [];
      let length = 0;

      for (const index of indices) {
        if (length >= budget) break;
        if (seen.has(index)) continue;
        seen.add(index);
        try {
          const text = await extractSectionTextSample(sections[index]);
          if (!text) continue;
          const separatorLength = parts.length > 0 ? 2 : 0;
          const available = Math.max(0, budget - length - separatorLength);
          if (available === 0) break;
          const part = text.slice(0, available);
          if (reverseOutput) parts.unshift(part);
          else parts.push(part);
          length += separatorLength + part.length;
        } catch (err) {
          console.warn(`[TextSample] Failed to extract section ${index}:`, err);
        }
      }

      return parts.join('\n\n');
    }

    async function handleExtractBookTextSample(msg) {
      const requestedMax = Number(msg.maxChars);
      const maxChars = Math.min(
        48000,
        Math.max(1, Number.isFinite(requestedMax) ? Math.floor(requestedMax) : 48000)
      );
      let sampleBook = null;

      try {
        sampleBook = await createBookForTextSample(msg);
        const sections = Array.isArray(sampleBook?.sections) ? sampleBook.sections : [];
        if (sections.length === 0) throw new Error('The book contains no readable sections');

        const indices = Array.from({ length: sections.length }, (_, index) => index);
        const middleStart = Math.max(0, Math.floor(sections.length / 2));
        const seen = new Set();
        const regionBudget = Math.max(1, Math.floor(maxChars / 3));
        const start = await collectTextSampleRegion(
          sections,
          indices,
          regionBudget,
          seen,
          false
        );
        const middle = await collectTextSampleRegion(
          sections,
          indices.slice(middleStart),
          regionBudget,
          seen,
          false
        );
        const end = await collectTextSampleRegion(
          sections,
          indices.slice().reverse(),
          maxChars - start.length - middle.length,
          seen,
          true
        );
        const text = [start, middle, end]
          .filter(Boolean)
          .join('\n\n[…]\n\n')
          .slice(0, maxChars);

        postToRN('textSampleExtracted', { text });
      } catch (err) {
        console.error('[WebView] Error extracting a bounded text sample:', err);
        postToRN('textSampleExtracted', { error: String(err) });
      } finally {
        try {
          await sampleBook?.destroy?.();
        } catch {}
      }
    }

    async function handleExtractChapters() {
      if (!currentBook) {
        postToRN('chaptersExtracted', { error: 'No book loaded' });
        return;
      }

      try {
        const sections = currentBook.sections || [];
        const toc = currentBook.toc || [];

        // Build map of href to title mapping
        const tocMap = new Map();
        function walkToc(items) {
          for (const item of items) {
            if (item.label) {
              tocMap.set(item.index, item.label);
              if (item.href) {
                const base = item.href.split("#")[0];
                tocMap.set(base, item.label);
                tocMap.set(item.href, item.label);
              }
            }
            if (item.subitems && item.subitems.length) {
              walkToc(item.subitems);
            }
          }
        }
        walkToc(toc);

        const chapters = [];
        let skippedNoCreateDocument = 0;

        for (let i = 0; i < sections.length; i++) {
          const section = sections[i];
          if (!section.createDocument) {
            skippedNoCreateDocument += 1;
            continue;
          }

          try {
            const doc = await section.createDocument();
            if (!doc.body) continue;

            const title = tocMap.get(i) || tocMap.get(section.href || "") || `Section ${i + 1}`;
            const CFI = window.CFI || (window.EpubCFI && window.EpubCFI.fake ? window.EpubCFI : null);
            let baseCfi = section.cfi;

            // If CFI generation is available but no base cfi, try to fake it
            if (!baseCfi && typeof CFI?.fake?.fromIndex === 'function') {
              baseCfi = CFI.fake.fromIndex(i);
            } else if (!baseCfi) {
              baseCfi = `epubcfi(/6/${(i + 1) * 2}!)`; // Fallback approximate
            }

            const segments = extractSegmentsWithCfi(doc, baseCfi, CFI);
            if (segments.length === 0) continue;

            const content = segments.map(s => s.text).join("\\n\\n");
            chapters.push({ index: i, title, content, segments });

            // Reclaim memory
            doc.documentElement.innerHTML = "";
          } catch (err) {
            console.warn(`[WebView] Failed to extract section ${i}:`, err);
          }
        }

        console.log('[WebView] Chapter extraction summary:', {
          sections: sections.length,
          chapters: chapters.length,
          segments: chapters.reduce((sum, chapter) => sum + (chapter.segments?.length || 0), 0),
          skippedNoCreateDocument
        });

        postToRN('chaptersExtracted', { chapters });
      } catch (err) {
        console.error('[WebView] Error extracting chapters:', err);
        postToRN('chaptersExtracted', { error: String(err) });
      }
    }

    function extractSegmentsWithCfi(doc, baseCfi, CFI) {
      const segments = [];
      const body = doc.body;
      if (!body) return segments;

      const blockSelector = "p, h1, h2, h3, h4, h5, h6, li, blockquote, dd, dt, figcaption, pre, td, th";
      const blocks = body.querySelectorAll(blockSelector);

      if (blocks.length === 0) {
        const text = body.textContent?.trim();
        if (text) {
          segments.push({ text, cfi: baseCfi });
        }
        return segments;
      }

      for (let i = 0; i < blocks.length; i++) {
        const block = blocks[i];
        const text = extractBlockText(block);
        if (!text || text.length < 2) continue;

        try {
          if (!CFI) {
            segments.push({ text, cfi: baseCfi });
            continue;
          }

          const textNodes = getTextNodes(block);
          if (textNodes.length === 0) {

          : function(callback) { return setTimeout(function() { callback(Date.now()); }, 16); };

            previous = next;

              if (readings.length === word.length) {
                for (var k = 0; k < word.length; k++) {
                  tokens.push({ char: word[k], reading: readings[k], needsRuby: true });
                }
              } else {
                tokens.push({ char: word, reading: reading, needsRuby: true });
              }
              i += len;
              matched = true;
              break;
            }

        if (matched) continue;
        var singleReading = '';
        if (_rubyWordDict && _rubyWordDict[ch]) {
          singleReading = _rubyWordDict[ch][0];
        } else if (_rubyCharDict && _rubyCharDict[ch]) {
          singleReading = _rubyCharDict[ch];

        tokens.push({ char: ch, reading: singleReading, needsRuby: true });
        i++;
