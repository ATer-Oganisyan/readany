<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar Web consumer</title>
  </head>
  <body>
    <main>
      <div id="avatar"></div>
      <div class="controls">
        <button type="button" data-animation="sleeping">Sleeping</button>
        <button type="button" data-animation="idle">Idle</button>
        <button type="button" data-expression="neutral">Neutral</button>
        <button type="button" id="pause">Pause</button>
        <button type="button" id="stop">Stop</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
