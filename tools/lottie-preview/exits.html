<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg,#111);color:var(--fg,#fff);font:16px/1.5 system-ui}main{max-width:1200px;margin:32px auto;padding:24px}h1{font-size:26px;margin:0}p{color:#ffffff99}button,select{font:inherit;color:inherit;background:var(--panel,#282828);border:1px solid #ffffff30;border-radius:var(--radius,10px);padding:9px 14px;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:4px}a{color:inherit}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:16px}.card{min-width:0}.stage{height:235px;display:grid;place-items:center;background:#941a00;border-radius:26px;margin:12px 0}.disc{width:145px;height:145px;border-radius:50%;border:1px solid #ff643a;background:linear-gradient(150deg,#de3103,#c32000);display:grid;place-items:center}.disc svg{width:136px;height:136px}h2{font-size:18px;margin:0}.card button{width:100%}#status{min-height:24px}
</style><main><h1>Шесть выходов из спиннера</h1><p>Один оборот за 400 мс → пружинный морфинг в pause за 350 мс. Отличается только положение начала выхода. 0° — разрывы сверху и снизу.</p><div class="controls"><button id="all" disabled>Повторить все</button><label>Скорость <select id="speed"><option value="1">Обычная</option><option value="0.5">½ скорости</option><option value="0.25">¼ скорости</option></select></label><a href="index.html">Основной прототип</a></div><div class="grid" id="variants"></div><p id="status" role="status">Загрузка…</p><p>Без кроссфейда: два контура, по 8 точек. Можно повторять каждый вариант отдельно.</p></main><script type="module" src="exits.js?v=spring-exit"></script></html>
